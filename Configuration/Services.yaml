services:
  _defaults:
    autoconfigure: true
    autowire: true
    public: false

  cache.contacts_list:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: [ '@TYPO3\CMS\Core\Cache\CacheManager', 'getCache' ]
    arguments: [ 'contacts_list' ]

  PSBits\ContactBook\:
    resource: '../Classes/*'

  PSBits\ContactBook\Service\ContactService:
    arguments:
      $frontendCache: '@cache.contacts_list'
