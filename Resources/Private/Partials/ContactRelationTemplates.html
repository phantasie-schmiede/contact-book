<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
<f:render
    arguments="{contact: contact, generalTypes: generalTypes, recordType: 'Address'}"
    section="AccordionItem" />
<f:render
    arguments="{contact: contact, recordType: 'Document'}"
    section="AccordionItem" />
<f:render
    arguments="{contact: contact, generalTypes: generalTypes, recordType: 'EMail'}"
    section="AccordionItem" />
<f:render
    arguments="{contact: contact, eventTypes: eventTypes, recordType: 'Event'}"
    section="AccordionItem" />
<f:render
    arguments="{contact: contact, recordType: 'Job'}"
    section="AccordionItem" />
<f:render
    arguments="{contact: contact, generalTypes: generalTypes, phoneNumberTypes: phoneNumberTypes, recordType: 'PhoneNumber'}"
    section="AccordionItem" />
<f:render
    arguments="{contact: contact, generalTypes: generalTypes, recordType: 'Website'}"
    section="AccordionItem" />

<f:asset.script
    identifier="autoSizeTextArea"
    src="EXT:templates/Resources/Public/JavaScript/autoSizeTextArea.js"
    type="module" />
<f:asset.script
    identifier="clearInput"
    src="EXT:templates/Resources/Public/JavaScript/clearInput.js"
    type="module" />
<f:asset.script
    identifier="deleteContent"
    src="EXT:templates/Resources/Public/JavaScript/deleteContent.js"
    type="module" />
<f:asset.script
    identifier="formFieldSwitch"
    src="EXT:templates/Resources/Public/JavaScript/formFieldSwitch.js"
    type="module" />

<f:section name="AccordionItem">
    <foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Frontend/Contact/edit.xlf" />

    <div
        class="d-none"
        id="template{recordType}">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button
                    aria-controls="accordion{recordType}-###uid###"
                    aria-expanded="false"
                    class="accordion-button collapsed"
                    _data-bs-target="#accordion{recordType}-###uid###"
                    data-bs-toggle="collapse"
                    type="button">
                    <foundation:translate id="edit:dyn.new{recordType}" />
                </button>
            </h2>
            <div
                class="accordion-collapse collapse"
                data-bs-parent="#accordion{recordType}"
                id="accordion{recordType}-###uid###">
                <div class="accordion-body">
                    <f:render
                        arguments="{_all}"
                        partial="FormFields/{recordType}" />
                </div>
            </div>
        </div>
    </div>
</f:section>
</html>
