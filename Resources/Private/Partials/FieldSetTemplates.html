<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<div
    class="d-none"
    id="address-template">
    <f:render
        arguments="{_all}"
        partial="FormFields/Address" />
</div>

<div
    class="d-none"
    id="e-mail-template">
    <f:render
        arguments="{_all}"
        partial="FormFields/EMail" />
</div>

<div
    class="d-none"
    id="event-template">
    <f:render
        arguments="{_all}"
        partial="FormFields/Event" />
</div>

<div
    class="d-none"
    id="phone-number-template">
    <f:render
        arguments="{_all}"
        partial="FormFields/PhoneNumber" />
</div>

<div
    class="d-none"
    id="website-template">
    <f:render
        arguments="{_all}"
        partial="FormFields/Website" />
</div>
</html>
