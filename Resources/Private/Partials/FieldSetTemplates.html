<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<div
    class="d-none"
    id="address-template">
    <f:render
        arguments="{_all}"
        partial="FormFields/Address" />
</div>

<div
    class="d-none"
    id="e-mail-template">
    <f:render
        arguments="{_all}"
        partial="FormFields/EMail" />
</div>

<div
    class="d-none"
    id="event-template">
    <f:render
        arguments="{_all}"
        partial="FormFields/Event" />
</div>

<div
    class="d-none"
    id="phone-number-template">
    <f:render
        arguments="{_all}"
        partial="FormFields/PhoneNumber" />
</div>

<div
    class="d-none"
    id="website-template">
    <f:render
        arguments="{_all}"
        partial="FormFields/Website" />
</div>

<f:asset.script
    identifier="copyContent"
    src="EXT:psb_templates/Resources/Public/JavaScript/copyContent.js"
    type="module" />
<f:asset.script
    identifier="deleteContent"
    src="EXT:psb_templates/Resources/Public/JavaScript/deleteContent.js"
    type="module" />
<f:asset.script
    identifier="formFieldSwitch"
    src="EXT:psb_templates/Resources/Public/JavaScript/formFieldSwitch.js"
    type="module" />
<f:asset.script
    identifier="inputAutocomplete"
    src="EXT:psb_templates/Resources/Public/JavaScript/inputAutocomplete.js"
    type="module" />
</html>
