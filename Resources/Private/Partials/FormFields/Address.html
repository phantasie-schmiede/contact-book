<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbContacts="http://typo3.org/ns/PSB/PsbContacts/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers"
    xmlns:psbTemplates="http://typo3.org/ns/PSB/PsbTemplates/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/address.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Frontend/Contact/edit.xlf" />

<f:if condition="{record}">
    <f:then>
        <f:variable
            name="uid"
            value="{record.uid}" />
    </f:then>
    <f:else>
        <f:variable
            name="uid"
            value="###uid###" />
    </f:else>
</f:if>

<div class="col-md-6">
    <label
        class="form-label">
        <psbFoundation:translate id="address:type" />
    </label>
    <f:form.select
        class="form-select"
        name="address[{uid}][type]"
        value="{record.type.value}">
        <f:for
            as="label"
            each="{generalTypes}"
            key="value">
            <f:form.select.option value="{value}">
                <psbFoundation:translate id="address:type.{value}" />
            </f:form.select.option>
        </f:for>
    </f:form.select>
</div>
<div class="col-md-6">
    <label
        class="form-label">
        <psbFoundation:translate id="address:street" />
    </label>
    <f:form.textfield
        class="form-control"
        name="address[{uid}][street]"
        type="text"
        value="{record.street}" />
</div>
<div class="col-md-6">
    <label
        class="form-label">
        <psbFoundation:translate id="address:houseNumber" />
    </label>
    <f:form.textfield
        class="form-control"
        name="address[{uid}][houseNumber]"
        type="text"
        value="{record.houseNumber}" />
</div>
<div class="col-md-6">
    <label
        class="form-label">
        <psbFoundation:translate id="address:zipCode" />
    </label>
    <f:form.textfield
        class="form-control"
        name="address[{uid}][zipCode]"
        type="text"
        value="{record.zipCode}" />
</div>
<div class="col-md-6">
    <label
        class="form-label">
        <psbFoundation:translate id="address:city" />
    </label>
    <f:form.textfield
        class="form-control"
        name="address[{uid}][city]"
        type="text"
        value="{record.city}" />
</div>
<div class="col-md-6">
    <label
        class="form-label">
        <psbFoundation:translate id="address:county" />
    </label>
    <f:form.select
        class="form-select"
        name="address[{uid}][county]"
        options="{psbContacts:data.countyNames()}"
        value="{record.county -> f:or(alternative: 'Schleswig-Holstein')}" />
</div>
<div class="col-md-6">
    <label
        class="form-label">
        <psbFoundation:translate id="address:country" />
    </label>
    <f:form.select
        class="form-select"
        options="{psbTemplates:data.countryNames()}"
        name="address[{uid}][country]"
        value="{record.country -> f:or(alternative: 'DE')}" />
</div>
<div class="col-md-6">
    <label
        class="form-label">
        weitere Kontakte
    </label>
    <input
        autocomplete="off"
        class="form-control"
        data-psb-autocomplete-items="{allContacts}"
        data-psb-autocomplete-preselection="{psbContacts:json.relatedContacts(relatedEntity: record, contact: contact)}"
        data-psb-autocomplete-selection-target="#contact-selection-{uid}"
        data-psb-autocomplete-value-target="#contact-value-{uid}"
        type="text" />
    <ul
        class="list-group list-group-flush"
        id="contact-selection-{uid}">
    </ul>
    <f:form.hidden
        id="contact-value-{uid}"
        name="address[{uid}][contacts]" />
</div>
<div class="col-md-6">
    <label
        class="form-label">
        <psbFoundation:translate id="address:notes" />
    </label>
    <f:form.textarea
        class="form-control"
        name="address[{uid}][notes]"
        value="{record.notes}" />
</div>
<div
    class="btn btn-danger mt-3"
    data-psb-delete-mode="closest"
    data-psb-delete-target=".accordion-item">
    <psbFoundation:translate id="edit:remove" />
</div>
</html>
