<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:contactBook="http://typo3.org/ns/PSBits/ContactBook/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers"
    xmlns:templates="http://typo3.org/ns/PSBits/Templates/ViewHelpers">
<foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Backend/Configuration/TCA/address.xlf" />
<foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Frontend/Contact/edit.xlf" />

<f:if condition="{record}">
    <f:then>
        <f:variable
            name="postponed"
            value="" />
        <f:variable
            name="uid"
            value="{record.uid}" />
    </f:then>
    <f:else>
        <f:variable
            name="defaultGeneralType"
            value="{contactType.generalRelationType.value}" />
        <f:variable
            name="postponed"
            value="1" />
        <f:variable
            name="uid"
            value="###uid###" />
    </f:else>
</f:if>

<div class="form-floating mb-3">
    <f:form.select
        class="form-select"
        name="address[{uid}][type]"
        value="{record.type.value -> f:or(alternative: defaultGeneralType)}">
        <f:for
            as="label"
            each="{generalTypes}"
            key="value">
            <f:form.select.option value="{value}">
                <foundation:translate id="address:type.{value}" />
            </f:form.select.option>
        </f:for>
    </f:form.select>
    <label
        class="form-label">
        <foundation:translate id="address:type" />
    </label>
</div>
<div class="form-floating mb-3">
    <f:form.textfield
        class="form-control"
        name="address[{uid}][street]"
        placeholder="{foundation:translate(id: 'address:street')}"
        type="text"
        value="{record.street}" />
    <label
        class="form-label">
        <foundation:translate id="address:street" />
    </label>
</div>
<div class="form-floating mb-3">
    <f:form.textfield
        class="form-control"
        name="address[{uid}][houseNumber]"
        placeholder="{foundation:translate(id: 'address:houseNumber')}"
        type="text"
        value="{record.houseNumber}" />
    <label
        class="form-label">
        <foundation:translate id="address:houseNumber" />
    </label>
</div>
<div class="form-floating mb-3">
    <f:form.textfield
        class="form-control"
        name="address[{uid}][zipCode]"
        placeholder="{foundation:translate(id: 'address:zipCode')}"
        type="text"
        value="{record.zipCode}" />
    <label
        class="form-label">
        <foundation:translate id="address:zipCode" />
    </label>
</div>
<div class="form-floating mb-3">
    <f:form.textfield
        class="form-control"
        name="address[{uid}][city]"
        placeholder="{foundation:translate(id: 'address:city')}"
        type="text"
        value="{record.city}" />
    <label
        class="form-label">
        <foundation:translate id="address:city" />
    </label>
</div>
<div class="form-floating mb-3">
    <f:form.select
        class="form-select"
        name="address[{uid}][county]"
        options="{contactBook:data.countyNames()}"
        value="{record.county -> f:or(alternative: 'Schleswig-Holstein')}" />
    <label
        class="form-label">
        <foundation:translate id="address:county" />
    </label>
</div>
<div class="form-floating mb-3">
    <f:form.select
        class="form-select"
        options="{templates:data.countryNames()}"
        name="address[{uid}][country]"
        value="{record.country -> f:or(alternative: 'DE')}" />
    <label
        class="form-label">
        <foundation:translate id="address:country" />
    </label>
</div>
<div class="form-floating mb-3">
    <f:render
        arguments="{
            altValueField: 1,
            filterOptions: {
                itemSearchField: 'searchTerms',
                preferText: 1,
            },
            id: 'address-contacts-{uid}',
            label: '{foundation:translate(id: \'edit:additionalContacts.address\')}',
            listClass: 'js-autocomplete-contacts',
            multiple: 1,
            name: 'address[{uid}][contacts]',
            postponed: postponed,
            preselection: record.contactUidsAsJson
        }"
        partial="Component/InputAutocomplete" />
</div>
<div class="form-floating mb-3">
    <f:form.textarea
        class="form-control psbits-auto-size"
        name="address[{uid}][notes]"
        placeholder="{foundation:translate(id: 'address:notes')}"
        value="{record.notes}" />
    <label
        class="form-label">
        <foundation:translate id="address:notes" />
    </label>
</div>
<div
    class="btn btn-danger"
    data-psbits-delete-mode="closest"
    data-psbits-delete-target=".accordion-item">
    <foundation:translate id="edit:remove" />
</div>
</html>
