<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbContacts="http://typo3.org/ns/PSB/PsbContacts/ViewHelpers">
<f:if condition="{address}">
    <f:then>
        <f:variable
            name="uid"
            value="{address.uid}" />
    </f:then>
    <f:else>
        <f:variable
            name="uid"
            value="###uid###" />
    </f:else>
</f:if>

<fieldset class="border border-light-subtle mb-3">
    <div class="col-md-6">
        <label
            class="form-label">
            Typ
        </label>
        <f:form.select
            class="form-select"
            name="address[{uid}][type]"
            options="{generalTypes}"
            value="{address.type}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            Straße
        </label>
        <f:form.textfield
            class="form-control"
            name="address[{uid}][street]"
            type="text"
            value="{address.street}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            Hausnummer
        </label>
        <f:form.textfield
            class="form-control"
            name="address[{uid}][houseNumber]"
            type="text"
            value="{address.houseNumber}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            PLZ
        </label>
        <f:form.textfield
            class="form-control"
            name="address[{uid}][zipCode]"
            type="text"
            value="{address.zipCode}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            Ort
        </label>
        <f:form.textfield
            class="form-control"
            name="address[{uid}][city]"
            type="text"
            value="{address.city}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            Bundesland
        </label>
        <f:form.textfield
            class="form-control"
            name="address[{uid}][county]"
            type="text"
            value="{address.county}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            Land
        </label>
        <f:form.textfield
            class="form-control"
            name="address[{uid}][country]"
            type="text"
            value="{address.country}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            weitere Kontakte
        </label>
        <input
            autocomplete="off"
            class="form-control"
            data-psb-autocomplete-items="{allContacts}"
            data-psb-autocomplete-preselection="{psbContacts:json.relatedContacts(relatedEntity: address, contact: contact)}"
            data-psb-autocomplete-selection-target="#contact-selection-{uid}"
            data-psb-autocomplete-value-target="#contact-value-{uid}"
            type="text" />
        <ul
            class="list-group list-group-flush"
            id="contact-selection-{uid}">
        </ul>
        <f:form.hidden
            id="contact-value-{uid}"
            name="address[{uid}][contacts]" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            Notizen
        </label>
        <f:form.textarea
            class="form-control"
            name="address[{uid}][notes]"
            value="{address.notes}" />
    </div>
    <div
        class="btn btn-danger"
        data-psb-delete-mode="closest"
        data-psb-delete-target="fieldset">
        Entfernen
    </div>
</fieldset>
</html>
