<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<div class="col-md-6">
    <label
        class="form-label"
        for="type">
        Art des Eintrags
    </label>
    <f:form.select
        class="form-select"
        id="type"
        options="{contactTypes}"
        property="type" />
</div>
<div
    class="col-md-6{f:if(condition: 'company != {contact.type}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="companyName">
        Unternehmensname
    </label>
    <f:form.textfield
        class="form-control"
        id="companyName"
        property="companyName" />
</div>
<div class="col-md-6"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="companies">
        Unternehmen
    </label>
    <f:form.select
        class="form-control"
        id="companies"
        optionLabelField="companyName"
        optionValueField="uid"
        options="{companies}"
        prependOptionLabel="Bitte wählen"
        prependOptionValue=""
        property="companies" />
</div>

<div
    class="col-md-4"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="firstName">
        Vorname
    </label>
    <f:form.textfield
        class="form-control"
        id="firstName"
        property="firstName" />
</div>
<div
    class="col-md-4"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="middleNames">
        weitere Vornamen
    </label>
    <f:form.textfield
        class="form-control"
        id="middleNames"
        property="middleNames" />
</div>
<div
    class="col-md-4"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="lastName">
        Nachname
    </label>
    <f:form.textfield
        class="form-control"
        id="lastName"
        property="lastName" />
</div>

<h5>Adressen</h5>

<f:for
    as="address"
    each="{contact.addresses}">
    <f:render
        arguments="{_all}"
        partial="FormFields/Address" />
</f:for>

<div id="new-addresses"></div>
<span
    class="btn btn-secondary"
    data-psb-copy-mode="append"
    data-psb-copy-source="#address-template"
    data-psb-copy-target="#new-addresses">
    Neue Adresse hinzufügen
</span>

<h5>Telefonnummern</h5>
<f:for
    as="phoneNumber"
    each="{contact.phoneNumbers}">
    <f:render
        arguments="{_all}"
        partial="FormFields/PhoneNumber" />
</f:for>
<div id="new-phone-numbers"></div>
<span
    class="btn btn-secondary"
    data-psb-copy-mode="append"
    data-psb-copy-source="#phone-number-template"
    data-psb-copy-target="#new-phone-numbers">
    Neue Telefonnummer hinzufügen
</span>

<h5>E-Mail-Adressen</h5>
<f:for
    as="eMail"
    each="{contact.eMails}">
    <f:render
        arguments="{_all}"
        partial="FormFields/EMail" />
</f:for>
<div id="new-e-mails"></div>
<span
    class="btn btn-secondary"
    data-psb-copy-mode="append"
    data-psb-copy-source="#e-mail-template"
    data-psb-copy-target="#new-e-mails">
    Neue E-Mail-Adresse hinzufügen
</span>

<h5>Webseiten</h5>
<f:for
    as="website"
    each="{contact.websites}">
    <f:render
        arguments="{_all}"
        partial="FormFields/Website" />
</f:for>
<div id="new-websites"></div>
<span
    class="btn btn-secondary"
    data-psb-copy-mode="append"
    data-psb-copy-source="#website-template"
    data-psb-copy-target="#new-websites">
    Neue Website hinzufügen
</span>

<h5>Ereignisse</h5>
<f:for
    as="event"
    each="{contact.events}">
    <f:render
        arguments="{_all}"
        partial="FormFields/Event" />
</f:for>
<div id="new-events"></div>
<span
    class="btn btn-secondary"
    data-psb-copy-mode="append"
    data-psb-copy-source="#event-template"
    data-psb-copy-target="#new-events">
    Neues Ereignis hinzufügen
</span>
</html>
