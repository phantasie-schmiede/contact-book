<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/contact.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Frontend/Contact/edit.xlf" />

<div class="col-md-6">
    <label
        class="form-label"
        for="type">
        <psbFoundation:translate id="contact:type" />
    </label>
    <f:form.select
        class="form-select"
        id="type"
        options="{contactTypes}"
        name="contact[type]"
        value="{contact.type.value}" />
</div>
<div
    class="col-md-6{f:if(condition: 'company != {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="companyName">
        <psbFoundation:translate id="contact:companyName" />
    </label>
    <f:form.textfield
        class="form-control"
        id="companyName"
        property="companyName" />
</div>
<div class="col-md-6{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="companies">
        <psbFoundation:translate id="contact:companies" />
    </label>
    <f:form.select
        class="form-select"
        id="companies"
        optionLabelField="companyName"
        optionValueField="uid"
        options="{companies}"
        prependOptionLabel="Bitte wählen"
        prependOptionValue=""
        property="companies" />
</div>

<div
    class="col-md-4{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="firstName">
        <psbFoundation:translate id="contact:firstName" />
    </label>
    <f:form.textfield
        class="form-control"
        id="firstName"
        property="firstName" />
</div>
<div
    class="col-md-4{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="middleNames">
        <psbFoundation:translate id="contact:middleNames" />
    </label>
    <f:form.textfield
        class="form-control"
        id="middleNames"
        property="middleNames" />
</div>
<div
    class="col-md-4{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="lastName">
        <psbFoundation:translate id="contact:lastName" />
    </label>
    <f:form.textfield
        class="form-control"
        id="lastName"
        property="lastName" />
</div>
<div class="col-12">
    <label
        class="form-label"
        for="notes">
        <psbFoundation:translate id="contact:notes" />
    </label>
    <f:form.textarea
        class="form-control"
        id="notes"
        property="notes"
        value="{contact.notes}" />
</div>

<h5>
    <psbFoundation:translate id="contact:addresses" />
</h5>

<f:render
    arguments="{recordTye: 'Address', records: contact.addresses}"
    section="Accordion" />

<h5>
    <psbFoundation:translate id="contact:phoneNumbers" />
</h5>

<f:render
    arguments="{recordTye: 'PhoneNumber', records: contact.phoneNumbers}"
    section="Accordion" />

<h5>
    <psbFoundation:translate id="contact:eMails" />
</h5>

<f:render
    arguments="{recordTye: 'EMail', records: contact.eMails}"
    section="Accordion" />

<h5>
    <psbFoundation:translate id="contact:websites" />
</h5>

<f:render
    arguments="{recordTye: 'Website', records: contact.websites}"
    section="Accordion" />

<h5>
    <psbFoundation:translate id="contact:events" />
</h5>

<f:render
    arguments="{recordTye: 'Event', records: contact.events}"
    section="Accordion" />

<f:section name="Accordion">
    <div
        class="accordion accordion-flush"
        id="accordion{recordTye}">
        <f:for
            as="record"
            each="{records}">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button
                        aria-controls="accordion{recordTye}-{record.uid}"
                        aria-expanded="false"
                        class="accordion-button collapsed"
                        data-bs-target="#accordion{recordTye}-{record.uid}"
                        data-bs-toggle="collapse"
                        type="button">
                        {record.compactValue}
                    </button>
                </h2>
                <div
                    class="accordion-collapse collapse"
                    data-bs-parent="#accordion{recordTye}"
                    id="accordion{recordTye}-{record.uid}">
                    <div class="accordion-body">
                        <f:render
                            arguments="{_all}"
                            partial="FormFields/{recordTye}" />
                    </div>
                </div>
            </div>
        </f:for>
    </div>

    <span
        class="btn btn-secondary"
        data-psb-copy-mode="append"
        data-psb-copy-source="#template{recordType}"
        data-psb-copy-target="#accordion{recordType}">
    <psbFoundation:translate id="edit:addNew{recordType}" />
</span>
</f:section>
</html>
