<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<div class="col-md-6">
    <label
        class="form-label"
        for="type">
        Art des Eintrags
    </label>
    <f:form.select
        class="form-select"
        id="type"
        options="{types}"
        property="type" />
</div>
<div class="col-md-6">
    <label
        class="form-label"
        for="companyName">
        Unternehmensname
    </label>
    <f:form.textfield
        class="form-control"
        id="companyName"
        property="companyName" />
</div>
<div class="col-md-6">
    <label
        class="form-label"
        for="companies">
        Unternehmen
    </label>
    <f:form.select
        class="form-control"
        id="companies"
        options="{companies}"
        property="companies" />
</div>

<div class="col-md-4">
    <label
        class="form-label"
        for="firstName">
        Vorname
    </label>
    <f:form.textfield
        class="form-control"
        id="firstName"
        property="firstName" />
</div>
<div class="col-md-4">
    <label
        class="form-label"
        for="middleNames">
        weitere Vornamen
    </label>
    <f:form.textfield
        class="form-control"
        id="middleNames"
        property="middleNames" />
</div>
<div class="col-md-4">
    <label
        class="form-label"
        for="lastName">
        Nachname
    </label>
    <f:form.textfield
        class="form-control"
        id="lastName"
        property="lastName" />
</div>

<h5>Ereignisse</h5>
<f:for
    as="event"
    each="{contact.events}">
    {event.type} am {event.date -> f:format.date(format: 'd.m.Y')}
</f:for>
<div id="new-events"></div>
<span
    class="btn btn-secondary"
    data-psb-copy-mode="append"
    data-psb-copy-source="#event-template"
    data-psb-copy-target="#new-events">
    Neues Ereignis hinzufügen
</span>
</html>
