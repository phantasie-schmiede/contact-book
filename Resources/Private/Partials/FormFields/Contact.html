<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:contactBook="http://typo3.org/ns/PSBits/ContactBook/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
<foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Backend/Configuration/TCA/contact.xlf" />

<div class="form-floating mb-3">
    <f:form.select
        class="form-select"
        id="type"
        name="contact[type]"
        value="{contact.type.value}">
        <f:for
            as="label"
            each="{contactTypes}"
            key="value">
            <f:form.select.option value="{value}">
                <foundation:translate id="contact:dyn.type.{value}" />
            </f:form.select.option>
        </f:for>
    </f:form.select>
    <label for="type">
        <foundation:translate id="contact:type" />
    </label>
</div>

<f:variable
    name="tabAddressesContent"
    value="{f:render(arguments: {allContacts: allContacts, contact: contact, generalTypes: generalTypes, label: 'addresses', recordType: 'Address', records: contact.addresses}, section: 'Accordion')}" />
<f:variable
    name="tabAddressesLabel"
    value="{core:icon(identifier: 'templates-geo-alt', size: 'small')}" />
<f:variable
    name="tabDocumentsContent"
    value="{f:render(arguments: {allContacts: allContacts, contact: contact, label: 'documents', recordType: 'Document', records: contact.documents}, section: 'Accordion')}" />
<f:variable
    name="tabDocumentsLabel"
    value="{core:icon(identifier: 'templates-files', size: 'small')}" />
<f:variable
    name="tabEMailsContent"
    value="{f:render(arguments: {allContacts: allContacts, contact: contact, generalTypes: generalTypes, label: 'eMails', recordType: 'EMail', records: contact.eMails}, section: 'Accordion')}" />
<f:variable
    name="tabEMailsLabel"
    value="{core:icon(identifier: 'templates-envelope-at', size: 'small')}" />
<f:variable
    name="tabEventsContent"
    value="{f:render(arguments: {allContacts: allContacts, contact: contact, eventTypes: eventTypes, label: 'events', recordType: 'Event', records: contact.events}, section: 'Accordion')}" />
<f:variable
    name="tabEventsLabel"
    value="{core:icon(identifier: 'templates-calendar-event', size: 'small')}" />
<f:variable
    name="tabNameContent"
    value="{f:render(arguments: {contact: contact}, section: 'TabNameContent')}" />
<f:variable
    name="tabNameLabel"
    value="{core:icon(identifier: 'templates-tag', size: 'small')}" />
<f:variable
    name="tabOtherContent"
    value="{f:render(arguments: {allContactGroups: allContactGroups, contact: contact}, section: 'TabOtherContent')}" />
<f:variable
    name="tabOtherLabel"
    value="{core:icon(identifier: 'templates-three-dots', size: 'small')}" />
<f:variable
    name="tabPhoneNumbersContent"
    value="{f:render(arguments: {allContacts: allContacts, contact: contact, generalTypes: generalTypes, label: 'phoneNumbers', phoneNumberTypes: phoneNumberTypes, recordType: 'PhoneNumber', records: contact.phoneNumbers}, section: 'Accordion')}" />
<f:variable
    name="tabPhoneNumbersLabel"
    value="{core:icon(identifier: 'templates-telephone', size: 'small')}" />
<f:variable
    name="tabWebsitesContent"
    value="{f:render(arguments: {allContacts: allContacts, contact: contact, generalTypes: generalTypes, label: 'websites', recordType: 'Website', records: contact.websites}, section: 'Accordion')}" />
<f:variable
    name="tabWebsitesLabel"
    value="{core:icon(identifier: 'templates-globe', size: 'small')}" />
<f:variable
    name="tabWorkContent"
    value="{f:render(arguments: {allCompanies: allCompanies, contact: contact}, section: 'TabWorkContent')}" />
<f:variable
    name="tabWorkLabel"
    value="{core:icon(identifier: 'templates-briefcase', size: 'small')}" />

<f:render
    arguments="{
        tabs: '{
            0: {
                content: tabNameContent,
                id: \'name\',
                label: tabNameLabel
            },
            1: {
                content: tabWorkContent,
                id: \'work\',
                label: tabWorkLabel
            },
            2: {
                content: tabAddressesContent,
                id: \'addresses\',
                label: tabAddressesLabel
            },
            3: {
                content: tabPhoneNumbersContent,
                id: \'phone-numbers\',
                label: tabPhoneNumbersLabel
            },
            4: {
                content: tabEMailsContent,
                id: \'e-mails\',
                label: tabEMailsLabel
            },
            5: {
                content: tabWebsitesContent,
                id: \'websites\',
                label: tabWebsitesLabel
            },
            6: {
                content: tabEventsContent,
                id: \'events\',
                label: tabEventsLabel
            },
            7: {
                content: tabDocumentsContent,
                id: \'documents\',
                label: tabDocumentsLabel
            },
            8: {
                content: tabOtherContent,
                id: \'other\',
                label: tabOtherLabel
            }
        }',
        vertical: true,
    }"
    partial="Component/Tabs" />

<f:section name="Accordion">
    <foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Backend/Configuration/TCA/contact.xlf" />
    <foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Frontend/Contact/edit.xlf" />

    <h5>
        <foundation:translate id="contact:{label}" />
    </h5>
    <div
        class="accordion accordion-flush mb-3"
        id="accordion{recordType}">
        <f:for
            as="record"
            each="{records}">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button
                        aria-controls="accordion{recordType}-{record.uid}"
                        aria-expanded="false"
                        class="accordion-button collapsed"
                        data-bs-target="#accordion{recordType}-{record.uid}"
                        data-bs-toggle="collapse"
                        type="button">
                        {record.compactValue}
                    </button>
                </h2>
                <div
                    class="accordion-collapse collapse"
                    data-bs-parent="#accordion{recordType}"
                    id="accordion{recordType}-{record.uid}">
                    <div class="accordion-body">
                        <f:render
                            arguments="{_all}"
                            partial="FormFields/{recordType}" />
                    </div>
                </div>
            </div>
        </f:for>
    </div>

    <button
        class="bg-secondary-subtle btn"
        data-psbits-copy-mode="append"
        data-psbits-copy-source="#template{recordType}"
        data-psbits-copy-target="#accordion{recordType}"
        type="button">
        <foundation:translate id="edit:dyn.addNew{recordType}" />
    </button>
</f:section>

<f:section name="TabNameContent">
    <foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Backend/Configuration/TCA/contact.xlf" />
    <foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Frontend/Contact/edit.xlf" />

    <h5>
        <foundation:translate id="edit:tab.name" />
    </h5>
    <div
        class="form-floating mb-3{f:if(condition: 'company != {contact.type.value}', then: ' visually-hidden')}"
        data-psbits-form-condition-field="#type"
        data-psbits-form-condition-value="company">
        <f:form.textfield
            class="form-control"
            id="companyName"
            placeholder="{foundation:translate(id: 'contact:companyName')}"
            property="companyName" />
        <label
            class="form-label"
            for="companyName">
            <foundation:translate id="contact:companyName" />
        </label>
    </div>

    <fieldset
        class="mb-3{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
        data-psbits-form-condition-field="#type"
        data-psbits-form-condition-mode="hide"
        data-psbits-form-condition-value="company">
        <div class="form-floating mb-3">
            <f:form.textfield
                class="form-control"
                id="title"
                placeholder="{foundation:translate(id: 'contact:title')}"
                property="title" />
            <label
                class="form-label"
                for="title">
                <foundation:translate id="contact:title" />
            </label>
        </div>

        <div class="form-floating mb-3">
            <f:form.textfield
                class="form-control"
                id="firstName"
                placeholder="{foundation:translate(id: 'contact:firstName')}"
                property="firstName" />
            <label
                class="form-label"
                for="firstName">
                <foundation:translate id="contact:firstName" />
            </label>
        </div>

        <div class="form-floating mb-3">
            <f:form.textfield
                class="form-control"
                id="middleNames"
                placeholder="{foundation:translate(id: 'contact:middleNames')}"
                property="middleNames" />
            <label
                class="form-label"
                for="middleNames">
                <foundation:translate id="contact:middleNames" />
            </label>
        </div>

        <div class="form-floating mb-3">
            <f:form.textfield
                class="form-control"
                id="lastName"
                placeholder="{foundation:translate(id: 'contact:lastName')}"
                property="lastName" />
            <label
                class="form-label"
                for="lastName">
                <foundation:translate id="contact:lastName" />
            </label>
        </div>

        <div class="form-floating mb-3">
            <f:form.textfield
                class="form-control"
                id="birthName"
                placeholder="{foundation:translate(id: 'contact:birthName')}"
                property="birthName" />
            <label
                class="form-label"
                for="birthName">
                <foundation:translate id="contact:birthName" />
            </label>
        </div>

        <div class="form-floating">
            <f:form.textfield
                class="form-control"
                id="nickname"
                placeholder="{foundation:translate(id: 'contact:nickname')}"
                property="nickname" />
            <label
                class="form-label"
                for="nickname">
                <foundation:translate id="contact:nickname" />
            </label>
        </div>
    </fieldset>
</f:section>

<f:section name="TabOtherContent">
    <foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Backend/Configuration/TCA/contact.xlf" />
    <foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Frontend/Contact/edit.xlf" />

    <h5>
        <foundation:translate id="edit:tab.other" />
    </h5>

    <div class="form-floating mb-3">
        <f:form.textarea
            class="form-control psbits-auto-size"
            id="notes"
            placeholder="{foundation:translate(id: 'contact:notes')}"
            property="notes"
            value="{contact.notes}" />
        <label
            class="form-label"
            for="notes">
            <foundation:translate id="contact:notes" />
        </label>
    </div>

    <div class="form-floating mb-3">
        <input
            autocomplete="off"
            class="form-control psbits-clear-input"
            data-psbits-autocomplete-items="{allContactGroups}"
            data-psbits-autocomplete-preselection="{contactBook:json.relatedContactGroups(contact: contact)}"
            data-psbits-autocomplete-selection-target="#contactGroups-selection"
            data-psbits-autocomplete-value-target="#contactGroups-value"
            placeholder="{foundation:translate(id: 'contact:contactGroups')}"
            type="text" />
        <label
            class="form-label"
            for="contactGroups">
            <foundation:translate id="contact:contactGroups" />
        </label>
        <ul
            class="list-group list-group-flush"
            id="contactGroups-selection">
        </ul>
        <f:form.hidden
            id="contactGroups-value"
            name="contactGroups" />
    </div>
</f:section>

<f:section name="TabWorkContent">
    <foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Backend/Configuration/TCA/contact.xlf" />
    <foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Frontend/Contact/edit.xlf" />

    <h5>
        <foundation:translate id="edit:tab.work" />
    </h5>
    <div
        class="form-floating mb-3 position-relative{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
        data-psbits-form-condition-field="#type"
        data-psbits-form-condition-mode="hide"
        data-psbits-form-condition-value="company">
        <input
            autocomplete="off"
            class="form-control psbits-clear-input"
            data-psbits-autocomplete-items="{allCompanies}"
            data-psbits-autocomplete-preselection="{contactBook:json.relatedCompanies(contact: contact)}"
            data-psbits-autocomplete-selection-target="#companies-selection"
            data-psbits-autocomplete-value-target="#companies-value"
            placeholder="{foundation:translate(id: 'contact:companies')}"
            type="text" />
        <label
            class="form-label"
            for="companies">
            <foundation:translate id="contact:companies" />
        </label>
        <ul
            class="list-group list-group-flush"
            id="companies-selection">
        </ul>
        <f:form.hidden
            id="companies-value"
            name="companies" />
    </div>
</f:section>
</html>
