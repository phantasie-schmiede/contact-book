<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/contact.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Frontend/Contact/edit.xlf" />

<div class="col-md-6">
    <label
        class="form-label"
        for="type">
        <psbFoundation:translate id="contact:type" />
    </label>
    <f:form.select
        class="form-select"
        id="type"
        options="{contactTypes}"
        name="contact[type]"
        value="{contact.type.value}" />
</div>
<div
    class="col-md-6{f:if(condition: 'company != {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="companyName">
        <psbFoundation:translate id="contact:companyName" />
    </label>
    <f:form.textfield
        class="form-control"
        id="companyName"
        property="companyName" />
</div>
<div class="col-md-6{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="companies">
        <psbFoundation:translate id="contact:companies" />
    </label>
    <f:form.select
        class="form-select"
        id="companies"
        optionLabelField="companyName"
        optionValueField="uid"
        options="{companies}"
        prependOptionLabel="Bitte wählen"
        prependOptionValue=""
        property="companies" />
</div>

<div
    class="col-md-4{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="firstName">
        <psbFoundation:translate id="contact:firstName" />
    </label>
    <f:form.textfield
        class="form-control"
        id="firstName"
        property="firstName" />
</div>
<div
    class="col-md-4{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="middleNames">
        <psbFoundation:translate id="contact:middleNames" />
    </label>
    <f:form.textfield
        class="form-control"
        id="middleNames"
        property="middleNames" />
</div>
<div
    class="col-md-4{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <label
        class="form-label"
        for="lastName">
        <psbFoundation:translate id="contact:lastName" />
    </label>
    <f:form.textfield
        class="form-control"
        id="lastName"
        property="lastName" />
</div>
<div class="col-12">
    <label
        class="form-label"
        for="notes">
        <psbFoundation:translate id="contact:notes" />
    </label>
    <f:form.textarea
        class="form-control"
        id="notes"
        property="notes"
        value="{contact.notes}" />
</div>

<h5>
    <psbFoundation:translate id="contact:addresses" />
</h5>

<f:for
    as="address"
    each="{contact.addresses}">
    <f:render
        arguments="{_all}"
        partial="FormFields/Address" />
</f:for>

<div id="new-addresses"></div>
<span
    class="btn btn-secondary"
    data-psb-copy-mode="append"
    data-psb-copy-source="#address-template"
    data-psb-copy-target="#new-addresses">
    <psbFoundation:translate id="edit:addNewAddress" />
</span>

<h5>
    <psbFoundation:translate id="contact:phoneNumbers" />
</h5>
<f:for
    as="phoneNumber"
    each="{contact.phoneNumbers}">
    <f:render
        arguments="{_all}"
        partial="FormFields/PhoneNumber" />
</f:for>
<div id="new-phone-numbers"></div>
<span
    class="btn btn-secondary"
    data-psb-copy-mode="append"
    data-psb-copy-source="#phone-number-template"
    data-psb-copy-target="#new-phone-numbers">
    <psbFoundation:translate id="edit:addNewPhoneNumber" />
</span>

<h5>
    <psbFoundation:translate id="contact:eMails" />
</h5>
<f:for
    as="eMail"
    each="{contact.eMails}">
    <f:render
        arguments="{_all}"
        partial="FormFields/EMail" />
</f:for>
<div id="new-e-mails"></div>
<span
    class="btn btn-secondary"
    data-psb-copy-mode="append"
    data-psb-copy-source="#e-mail-template"
    data-psb-copy-target="#new-e-mails">
    <psbFoundation:translate id="edit:addNewEMail" />
</span>

<h5>
    <psbFoundation:translate id="contact:websites" />
</h5>
<f:for
    as="website"
    each="{contact.websites}">
    <f:render
        arguments="{_all}"
        partial="FormFields/Website" />
</f:for>
<div id="new-websites"></div>
<span
    class="btn btn-secondary"
    data-psb-copy-mode="append"
    data-psb-copy-source="#website-template"
    data-psb-copy-target="#new-websites">
    <psbFoundation:translate id="edit:addNewWebsite" />
</span>

<h5>
    <psbFoundation:translate id="contact:events" />
</h5>
<f:for
    as="event"
    each="{contact.events}">
    <f:render
        arguments="{_all}"
        partial="FormFields/Event" />
</f:for>
<div id="new-events"></div>
<span
    class="btn btn-secondary"
    data-psb-copy-mode="append"
    data-psb-copy-source="#event-template"
    data-psb-copy-target="#new-events">
    <psbFoundation:translate id="edit:addNewEvent" />
</span>
</html>
