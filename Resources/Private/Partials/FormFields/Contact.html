<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbContacts="http://typo3.org/ns/PSB/PsbContacts/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/contact.xlf" />

<f:render partial="Component/Form/Upload" />

<div class="form-floating mb-3">
    <f:form.select
        class="form-select"
        id="type"
        options="{contactTypes}"
        name="contact[type]"
        value="{contact.type.value}" />
    <label for="type">
        <psbFoundation:translate id="contact:type" />
    </label>
</div>

<div
    class="form-floating mb-3{f:if(condition: 'company != {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-value="company">
    <f:form.textfield
        class="form-control"
        id="companyName"
        placeholder="{psbFoundation:translate(id: 'contact:companyName')}"
        property="companyName" />
    <label
        class="form-label"
        for="companyName">
        <psbFoundation:translate id="contact:companyName" />
    </label>
</div>

<div class="form-floating mb-3 position-relative{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <input
        autocomplete="off"
        class="form-control js-clear-input"
        data-psb-autocomplete-items="{allCompanies}"
        data-psb-autocomplete-preselection="{psbContacts:json.relatedCompanies(contact: contact)}"
        data-psb-autocomplete-selection-target="#companies-selection"
        data-psb-autocomplete-value-target="#companies-value"
        placeholder="{psbFoundation:translate(id: 'contact:companies')}"
        type="text" />
    <label
        class="form-label"
        for="companies">
        <psbFoundation:translate id="contact:companies" />
    </label>
    <ul
        class="list-group list-group-flush"
        id="companies-selection">
    </ul>
    <f:form.hidden
        id="companies-value"
        name="companies" />
</div>

<div
    class="form-floating mb-3{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <f:form.textfield
        class="form-control"
        id="title"
        placeholder="{psbFoundation:translate(id: 'contact:title')}"
        property="title" />
    <label
        class="form-label"
        for="title">
        <psbFoundation:translate id="contact:title" />
    </label>
</div>

<div
    class="form-floating mb-3{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <f:form.textfield
        class="form-control"
        id="firstName"
        placeholder="{psbFoundation:translate(id: 'contact:firstName')}"
        property="firstName" />
    <label
        class="form-label"
        for="firstName">
        <psbFoundation:translate id="contact:firstName" />
    </label>
</div>

<div
    class="form-floating mb-3{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <f:form.textfield
        class="form-control"
        id="middleNames"
        placeholder="{psbFoundation:translate(id: 'contact:middleNames')}"
        property="middleNames" />
    <label
        class="form-label"
        for="middleNames">
        <psbFoundation:translate id="contact:middleNames" />
    </label>
</div>

<div
    class="form-floating mb-3{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <f:form.textfield
        class="form-control"
        id="lastName"
        placeholder="{psbFoundation:translate(id: 'contact:lastName')}"
        property="lastName" />
    <label
        class="form-label"
        for="lastName">
        <psbFoundation:translate id="contact:lastName" />
    </label>
</div>

<div
    class="form-floating mb-3{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <f:form.textfield
        class="form-control"
        id="birthName"
        placeholder="{psbFoundation:translate(id: 'contact:birthName')}"
        property="birthName" />
    <label
        class="form-label"
        for="birthName">
        <psbFoundation:translate id="contact:birthName" />
    </label>
</div>

<div
    class="form-floating mb-3{f:if(condition: 'company == {contact.type.value}', then: ' visually-hidden')}"
    data-psb-form-condition-field="#type"
    data-psb-form-condition-mode="hide"
    data-psb-form-condition-value="company">
    <f:form.textfield
        class="form-control"
        id="nickname"
        placeholder="{psbFoundation:translate(id: 'contact:nickname')}"
        property="nickname" />
    <label
        class="form-label"
        for="nickname">
        <psbFoundation:translate id="contact:nickname" />
    </label>
</div>

<div class="form-floating mb-3">
    <input
        autocomplete="off"
        class="form-control js-clear-input"
        data-psb-autocomplete-items="{allContactGroups}"
        data-psb-autocomplete-preselection="{psbContacts:json.relatedContactGroups(contact: contact)}"
        data-psb-autocomplete-selection-target="#contactGroups-selection"
        data-psb-autocomplete-value-target="#contactGroups-value"
        placeholder="{psbFoundation:translate(id: 'contact:contactGroups')}"
        type="text" />
    <label
        class="form-label"
        for="contactGroups">
        <psbFoundation:translate id="contact:contactGroups" />
    </label>
    <ul
        class="list-group list-group-flush"
        id="contactGroups-selection">
    </ul>
    <f:form.hidden
        id="contactGroups-value"
        name="contactGroups" />
</div>

<div class="form-floating mb-3">
    <f:form.textarea
        class="form-control"
        id="notes"
        placeholder="{psbFoundation:translate(id: 'contact:notes')}"
        property="notes"
        value="{contact.notes}" />
    <label
        class="form-label"
        for="notes">
        <psbFoundation:translate id="contact:notes" />
    </label>
</div>

<h5>
    <psbFoundation:translate id="contact:addresses" />
</h5>

<f:render
    arguments="{allContacts: allContacts, contact: contact, generalTypes: generalTypes, recordType: 'Address', records: contact.addresses}"
    section="Accordion" />

<h5 class="mt-3">
    <psbFoundation:translate id="contact:phoneNumbers" />
</h5>

<f:render
    arguments="{allContacts: allContacts, contact: contact, generalTypes: generalTypes, phoneNumberTypes: phoneNumberTypes, recordType: 'PhoneNumber', records: contact.phoneNumbers}"
    section="Accordion" />

<h5 class="mt-3">
    <psbFoundation:translate id="contact:eMails" />
</h5>

<f:render
    arguments="{allContacts: allContacts, contact: contact, generalTypes: generalTypes, recordType: 'EMail', records: contact.eMails}"
    section="Accordion" />

<h5 class="mt-3">
    <psbFoundation:translate id="contact:websites" />
</h5>

<f:render
    arguments="{allContacts: allContacts, contact: contact, generalTypes: generalTypes, recordType: 'Website', records: contact.websites}"
    section="Accordion" />

<h5 class="mt-3">
    <psbFoundation:translate id="contact:events" />
</h5>

<f:render
    arguments="{allContacts: allContacts, contact: contact, eventTypes: eventTypes, recordType: 'Event', records: contact.events}"
    section="Accordion" />

<f:section name="Accordion">
    <psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Frontend/Contact/edit.xlf" />

    <div
        class="accordion accordion-flush"
        id="accordion{recordType}">
        <f:for
            as="record"
            each="{records}">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button
                        aria-controls="accordion{recordType}-{record.uid}"
                        aria-expanded="false"
                        class="accordion-button collapsed"
                        data-bs-target="#accordion{recordType}-{record.uid}"
                        data-bs-toggle="collapse"
                        type="button">
                        {record.compactValue}
                    </button>
                </h2>
                <div
                    class="accordion-collapse collapse"
                    data-bs-parent="#accordion{recordType}"
                    id="accordion{recordType}-{record.uid}">
                    <div class="accordion-body">
                        <f:render
                            arguments="{_all}"
                            partial="FormFields/{recordType}" />
                    </div>
                </div>
            </div>
        </f:for>
    </div>

    <span
        class="btn bg-secondary-subtle btn"
        data-psb-copy-mode="append"
        data-psb-copy-source="#template{recordType}"
        data-psb-copy-target="#accordion{recordType}">
    <psbFoundation:translate id="edit:addNew{recordType}" />
</span>
</f:section>
</html>
