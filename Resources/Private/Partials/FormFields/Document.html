<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:contactBook="http://typo3.org/ns/PSBits/ContactBook/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
<foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Backend/Configuration/TCA/document.xlf" />
<foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Frontend/Contact/edit.xlf" />

<f:if condition="{record}">
    <f:then>
        <f:variable
            name="uid"
            value="{record.uid}" />
    </f:then>
    <f:else>
        <f:variable
            name="uid"
            value="###uid###" />
    </f:else>
</f:if>

<div class="mb-3">
    <f:if condition="{record}">
        <f:then>
            <f:image
                class="h-auto mw-100"
                image="{record.file}" />
        </f:then>
        <f:else>
            <f:render
                arguments="{accept: '*;capture=camera', id: 'document-{uid}', name: 'document[{uid}][file]'}"
                partial="Component/Form/Upload" />
        </f:else>
    </f:if>
</div>

<div
    class="form-floating mb-3">
    <f:form.textfield
        class="form-control"
        name="document[{uid}][title]"
        placeholder="{foundation:translate(id: 'document:title')}"
        value="{record.title}" />
    <label class="form-label">
        <foundation:translate id="document:title" />
    </label>
</div>

<div class="form-floating mb-3">
    <f:form.textarea
        class="form-control psbits-auto-size"
        name="document[{uid}][notes]"
        placeholder="{foundation:translate(id: 'document:notes')}"
        value="{record.notes}" />
    <label class="form-label">
        <foundation:translate id="document:notes" />
    </label>
</div>

<div class="form-floating mb-3">
    <input
        autocomplete="off"
        class="form-control psbits-clear-input"
        data-psbits-autocomplete-items="{allContacts}"
        data-psbits-autocomplete-preselection="{contactBook:json.relatedContacts(relatedEntity: record, contact: contact)}"
        data-psbits-autocomplete-selection-target="#contact-selection-{uid}"
        data-psbits-autocomplete-value-target="#contact-value-{uid}"
        placeholder="{foundation:translate(id: 'edit:additionalContacts.document')}"
        type="text" />
    <label class="form-label">
        <foundation:translate id="edit:additionalContacts.document" />
    </label>
    <ul
        class="list-group list-group-flush"
        id="contact-selection-{uid}">
    </ul>
    <f:form.hidden
        id="contact-value-{uid}"
        name="document[{uid}][contacts]" />
</div>

<div
    class="btn btn-danger"
    data-psbits-delete-mode="closest"
    data-psbits-delete-target=".accordion-item">
    <foundation:translate id="edit:remove" />
</div>
</html>
