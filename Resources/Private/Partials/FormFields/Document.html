<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbContacts="http://typo3.org/ns/PSB/PsbContacts/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/document.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Frontend/Contact/edit.xlf" />

<f:if condition="{record}">
    <f:then>
        <f:variable
            name="uid"
            value="{record.uid}" />
    </f:then>
    <f:else>
        <f:variable
            name="uid"
            value="###uid###" />
    </f:else>
</f:if>

<div class="mb-3">
    <f:if condition="{record}">
        <f:then>
            <f:image
                class="h-auto mw-100"
                image="{record.file}" />
        </f:then>
        <f:else>
            <f:render
                arguments="{id: 'document-{uid}', name: 'document[{uid}][file]'}"
                partial="Component/Form/Upload" />
        </f:else>
    </f:if>
</div>

<div
    class="form-floating mb-3">
    <f:form.textfield
        class="form-control"
        name="document[{uid}][title]"
        placeholder="{psbFoundation:translate(id: 'document:title')}"
        value="{record.title}" />
    <label class="form-label">
        <psbFoundation:translate id="document:title" />
    </label>
</div>

<div class="form-floating mb-3">
    <f:form.textarea
        class="form-control psb-templates-auto-size"
        name="document[{uid}][notes]"
        placeholder="{psbFoundation:translate(id: 'document:notes')}"
        value="{record.notes}" />
    <label class="form-label">
        <psbFoundation:translate id="document:notes" />
    </label>
</div>

<div class="form-floating mb-3">
    <input
        autocomplete="off"
        class="form-control psb-templates-clear-input"
        data-psb-autocomplete-items="{allContacts}"
        data-psb-autocomplete-preselection="{psbContacts:json.relatedContacts(relatedEntity: record, contact: contact)}"
        data-psb-autocomplete-selection-target="#contact-selection-{uid}"
        data-psb-autocomplete-value-target="#contact-value-{uid}"
        placeholder="{psbFoundation:translate(id: 'edit:additionalContacts.document')}"
        type="text" />
    <label class="form-label">
        <psbFoundation:translate id="edit:additionalContacts.document" />
    </label>
    <ul
        class="list-group list-group-flush"
        id="contact-selection-{uid}">
    </ul>
    <f:form.hidden
        id="contact-value-{uid}"
        name="document[{uid}][contacts]" />
</div>

<div
    class="btn btn-danger"
    data-psb-delete-mode="closest"
    data-psb-delete-target=".accordion-item">
    <psbFoundation:translate id="edit:remove" />
</div>
</html>
