<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbContacts="http://typo3.org/ns/PSB/PsbContacts/ViewHelpers">
<f:if condition="{eMail}">
    <f:then>
        <f:variable
            name="uid"
            value="{eMail.uid}" />
    </f:then>
    <f:else>
        <f:variable
            name="uid"
            value="###uid###" />
    </f:else>
</f:if>

<fieldset class="border border-light-subtle mb-3">
    <div class="col-md-6">
        <label
            class="form-label">
            Typ
        </label>
        <f:form.select
            class="form-select"
            name="eMail[{uid}][type]"
            options="{generalTypes}"
            value="{eMail.type}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            E-Mail-Adresse
        </label>
        <f:form.textfield
            class="form-control"
            name="eMail[{uid}][eMailAddress]"
            type="email"
            value="{eMail.eMailAddress}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            weitere Kontakte
        </label>
        <input
            autocomplete="off"
            class="form-control"
            data-psb-autocomplete-items="{allContacts}"
            data-psb-autocomplete-preselection="{psbContacts:json.relatedContacts(relatedEntity: eMail, contact: contact)}"
            data-psb-autocomplete-selection-target="#contact-selection-{uid}"
            data-psb-autocomplete-value-target="#contact-value-{uid}"
            type="text" />
        <ul
            class="list-group list-group-flush"
            id="contact-selection-{uid}">
        </ul>
        <f:form.hidden
            id="contact-value-{uid}"
            name="eMail[{uid}][contacts]" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            Notizen
        </label>
        <f:form.textarea
            class="form-control"
            name="eMail[{uid}][notes]"
            value="{eMail.notes}" />
    </div>
    <div
        class="btn btn-danger"
        data-psb-delete-mode="closest"
        data-psb-delete-target="fieldset">
        Entfernen
    </div>
</fieldset>
</html>
