<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:contactBook="http://typo3.org/ns/PSBits/ContactBook/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
<foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Backend/Configuration/TCA/eMail.xlf" />
<foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Frontend/Contact/edit.xlf" />

<f:if condition="{record}">
    <f:then>
        <f:variable
            name="uid"
            value="{record.uid}" />
    </f:then>
    <f:else>
        <f:variable
            name="uid"
            value="###uid###" />
    </f:else>
</f:if>

<div class="form-floating mb-3">
    <f:form.select
        class="form-select"
        name="eMail[{uid}][type]"
        value="{record.type.value}">
        <f:for
            as="label"
            each="{generalTypes}"
            key="value">
            <f:form.select.option value="{value}">
                <foundation:translate id="eMail:type.{value}" />
            </f:form.select.option>
        </f:for>
    </f:form.select>
    <label
        class="form-label">
        <foundation:translate id="eMail:type" />
    </label>
</div>
<div class="form-floating mb-3">
    <f:form.textfield
        class="form-control"
        name="eMail[{uid}][eMailAddress]"
        placeholder="{foundation:translate(id: 'eMail:eMailAddress')}"
        type="email"
        value="{record.eMailAddress}" />
    <label
        class="form-label">
        <foundation:translate id="eMail:eMailAddress" />
    </label>
</div>
<div class="form-floating mb-3">
    <input
        autocomplete="off"
        class="form-control psb-templates-clear-input"
        data-psb-autocomplete-items="{allContacts}"
        data-psb-autocomplete-preselection="{contactBook:json.relatedContacts(relatedEntity: record, contact: contact)}"
        data-psb-autocomplete-selection-target="#contact-selection-{uid}"
        data-psb-autocomplete-value-target="#contact-value-{uid}"
        placeholder="{foundation:translate(id: 'edit:additionalContacts.eMail')}"
        type="text" />
    <label
        class="form-label">
        <foundation:translate id="edit:additionalContacts.eMail" />
    </label>
    <ul
        class="list-group list-group-flush"
        id="contact-selection-{uid}">
    </ul>
    <f:form.hidden
        id="contact-value-{uid}"
        name="eMail[{uid}][contacts]" />
</div>
<div class="form-floating mb-3">
    <f:form.textarea
        class="form-control psb-templates-auto-size"
        name="eMail[{uid}][notes]"
        placeholder="{foundation:translate(id: 'eMail:notes')}"
        value="{record.notes}" />
    <label
        class="form-label">
        <foundation:translate id="eMail:notes" />
    </label>
</div>
<div
    class="btn btn-danger"
    data-psb-delete-mode="closest"
    data-psb-delete-target=".accordion-item">
    <foundation:translate id="edit:remove" />
</div>
</html>
