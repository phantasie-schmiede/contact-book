<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<f:if condition="{event}">
    <f:then>
        <f:variable
            name="uid"
            value="{event.uid}" />
    </f:then>
    <f:else>
        <f:variable
            name="uid"
            value="###uid###" />
    </f:else>
</f:if>

<fieldset class="border border-light-subtle mb-3">
    <div class="col-md-6">
        <label
            class="form-label">
            Event-Typ
        </label>
        <f:form.select
            class="form-select"
            name="event[{uid}][type]"
            options="{eventTypes}"
            value="{event.type}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            Datum
        </label>
        <f:form.textfield
            class="form-control"
            name="event[{uid}][date]"
            type="date"
            value="{event.date -> f:format.date(format: 'Y-m-d')}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            Notizen
        </label>
        <f:form.textarea
            class="form-control"
            name="event[{uid}][notes]"
            value="{event.notes}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-check-label">
            Jubiläen anzeigen
        </label>
        <f:form.checkbox
            checked="{f:if(condition: event.showAnniversaries, then: '1', else: '0')}"
            class="form-check-input"
            name="event[{uid}][showAnniversaries]"
            value="1" />
    </div>
    <div class="col-md-6">
        <label
            class="form-check-label">
            im Kalender anzeigen
        </label>
        <f:form.checkbox
            checked="{f:if(condition: event.showInCalendar, then: '1', else: '0')}"
            class="form-check-input"
            name="event[{uid}][showInCalendar]"
            value="1" />
    </div>
    <div
        class="btn btn-danger"
        data-psb-delete-mode="closest"
        data-psb-delete-target="fieldset">
        Entfernen
    </div>
</fieldset>
</html>
