<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbContacts="http://typo3.org/ns/PSB/PsbContacts/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/event.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Frontend/Contact/edit.xlf" />

<f:if condition="{record}">
    <f:then>
        <f:variable
            name="uid"
            value="{record.uid}" />
    </f:then>
    <f:else>
        <f:variable
            name="uid"
            value="###uid###" />
    </f:else>
</f:if>

<div class="form-floating mb-3">
    <f:form.select
        class="form-select"
        name="event[{uid}][type]"
        value="{record.type.value}">
        <f:for
            as="label"
            each="{eventTypes}"
            key="value">
            <f:form.select.option value="{value}">
                <psbFoundation:translate id="event:type.{value}" />
            </f:form.select.option>
        </f:for>
    </f:form.select>
    <label
        class="form-label">
        <psbFoundation:translate id="event:type" />
    </label>
</div>
<div class="input-group mb-3">
    <div class="form-floating">
        <f:form.textfield
            class="form-control"
            min="1"
            max="31"
            name="event[{uid}][day]"
            placeholder="{psbFoundation:translate(id: 'event:day')}"
            type="number"
            value="{record.day}" />
        <label
            class="form-label">
            <psbFoundation:translate id="event:day" />
        </label>
    </div>
    <div class="form-floating">
        <f:form.textfield
            class="form-control"
            min="1"
            max="12"
            name="event[{uid}][month]"
            placeholder="{psbFoundation:translate(id: 'event:month')}"
            type="number"
            value="{record.month}" />
        <label
            class="form-label">
            <psbFoundation:translate id="event:month" />
        </label>
    </div>
    <div class="form-floating">
        <f:form.textfield
            class="form-control"
            name="event[{uid}][year]"
            placeholder="{psbFoundation:translate(id: 'event:year')}"
            type="number"
            value="{record.year}" />
        <label
            class="form-label">
            <psbFoundation:translate id="event:year" />
        </label>
    </div>
</div>
<div class="form-check mb-3">
    <f:form.checkbox
        checked="{f:if(condition: record.showAnniversaries, then: '1', else: '0')}"
        class="form-check-input"
        id="event-{uid}-showAnniversaries"
        name="event[{uid}][showAnniversaries]"
        value="1" />
    <label
        class="form-check-label"
        for="event-{uid}-showAnniversaries">
        <psbFoundation:translate id="event:showAnniversaries" />
    </label>
</div>
<div class="form-check mb-3">
    <f:form.checkbox
        checked="{f:if(condition: record.showInCalendar, then: '1', else: '0')}"
        class="form-check-input"
        id="event-{uid}-showInCalendar"
        name="event[{uid}][showInCalendar]"
        value="1" />
    <label
        class="form-check-label"
        for="event-{uid}-showInCalendar">
        <psbFoundation:translate id="event:showInCalendar" />
    </label>
</div>
<div class="form-floating mb-3">
    <input
        autocomplete="off"
        class="form-control psb-templates-clear-input"
        data-psb-autocomplete-items="{allContacts}"
        data-psb-autocomplete-preselection="{psbContacts:json.relatedContacts(relatedEntity: record, contact: contact)}"
        data-psb-autocomplete-selection-target="#contact-selection-{uid}"
        data-psb-autocomplete-value-target="#contact-value-{uid}"
        placeholder="{psbFoundation:translate(id: 'edit:additionalContacts.event')}"
        type="text" />
    <label
        class="form-label">
        <psbFoundation:translate id="edit:additionalContacts.event" />
    </label>
    <ul
        class="list-group list-group-flush"
        id="contact-selection-{uid}">
    </ul>
    <f:form.hidden
        id="contact-value-{uid}"
        name="event[{uid}][contacts]" />
</div>
<div class="form-floating mb-3">
    <f:form.textarea
        class="form-control psb-templates-auto-size"
        name="event[{uid}][location]"
        placeholder="{psbFoundation:translate(id: 'event:location')}"
        value="{record.location}" />
    <label
        class="form-label">
        <psbFoundation:translate id="event:location" />
    </label>
</div>
<div class="form-floating mb-3">
    <f:form.textarea
        class="form-control psb-templates-auto-size"
        name="event[{uid}][notes]"
        placeholder="{psbFoundation:translate(id: 'event:notes')}"
        value="{record.notes}" />
    <label
        class="form-label">
        <psbFoundation:translate id="event:notes" />
    </label>
</div>
<div
    class="btn btn-danger"
    data-psb-delete-mode="closest"
    data-psb-delete-target=".accordion-item">
    <psbFoundation:translate id="edit:remove" />
</div>
</html>
