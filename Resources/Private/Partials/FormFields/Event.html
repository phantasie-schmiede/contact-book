<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<fieldset class="border border-light-subtle mb-3">
    <div class="col-md-6">
        <label
            class="form-label">
            Event-Typ
        </label>
        <f:form.select
            class="form-select"
            name="event[type][]"
            options="{eventTypes}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            Datum
        </label>
        <f:form.textfield
            class="form-control"
            name="event[date][]"
            type="date" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            Notizen
        </label>
        <f:form.textarea
            class="form-control"
            name="event[notes][]" />
    </div>
    <div class="col-md-6">
        <label
            class="form-check-label">
            Jubiläen anzeigen
        </label>
        <f:form.checkbox
            class="form-check-input"
            name="event[showAnniversaries]"
            value="1" />
    </div>
    <div class="col-md-6">
        <label
            class="form-check-label">
            im Kalender anzeigen
        </label>
        <f:form.checkbox
            class="form-check-input"
            name="event[showInCalendar]"
            value="1" />
    </div>
    <div
        class="btn btn-danger"
        data-psb-delete-mode="closest"
        data-psb-delete-target="fieldset">
        Entfernen
    </div>
</fieldset>
</html>
