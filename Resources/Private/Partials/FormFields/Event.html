<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbContacts="http://typo3.org/ns/PSB/PsbContacts/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/event.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Frontend/Contact/edit.xlf" />

<f:if condition="{event}">
    <f:then>
        <f:variable
            name="uid"
            value="{event.uid}" />
    </f:then>
    <f:else>
        <f:variable
            name="uid"
            value="###uid###" />
    </f:else>
</f:if>

<fieldset class="border border-light-subtle mb-3">
    <div class="col-md-6">
        <label
            class="form-label">
            <psbFoundation:translate id="event:type" />
        </label>
        <f:form.select
            class="form-select"
            name="event[{uid}][type]"
            value="{event.type}">
            <f:for
                as="label"
                each="{eventTypes}"
                key="value">
                <f:form.select.option value="{value}">
                    <psbFoundation:translate id="event:type.{value}" />
                </f:form.select.option>
            </f:for>
        </f:form.select>
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            <psbFoundation:translate id="event:date" />
        </label>
        <f:form.textfield
            class="form-control"
            name="event[{uid}][date]"
            type="date"
            value="{event.date -> f:format.date(format: 'Y-m-d')}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            weitere Kontakte
        </label>
        <input
            autocomplete="off"
            class="form-control"
            data-psb-autocomplete-items="{allContacts}"
            data-psb-autocomplete-preselection="{psbContacts:json.relatedContacts(relatedEntity: event, contact: contact)}"
            data-psb-autocomplete-selection-target="#contact-selection-{uid}"
            data-psb-autocomplete-value-target="#contact-value-{uid}"
            type="text" />
        <ul
            class="list-group list-group-flush"
            id="contact-selection-{uid}">
        </ul>
        <f:form.hidden
            id="contact-value-{uid}"
            name="event[{uid}][contacts]" />
    </div>
    <div class="col-md-6">
        <label
            class="form-label">
            <psbFoundation:translate id="event:notes" />
        </label>
        <f:form.textarea
            class="form-control"
            name="event[{uid}][notes]"
            value="{event.notes}" />
    </div>
    <div class="col-md-6">
        <label
            class="form-check-label">
            <psbFoundation:translate id="event:showAnniversaries" />
            <f:form.checkbox
                checked="{f:if(condition: event.showAnniversaries, then: '1', else: '0')}"
                class="form-check-input"
                name="event[{uid}][showAnniversaries]"
                value="1" />
        </label>
    </div>
    <div class="col-md-6">
        <label
            class="form-check-label">
            <psbFoundation:translate id="event:showInCalendar" />
            <f:form.checkbox
                checked="{f:if(condition: event.showInCalendar, then: '1', else: '0')}"
                class="form-check-input"
                name="event[{uid}][showInCalendar]"
                value="1" />
        </label>
    </div>
    <div
        class="btn btn-danger"
        data-psb-delete-mode="closest"
        data-psb-delete-target="fieldset">
        <psbFoundation:translate id="edit:remove" />
    </div>
</fieldset>
</html>
