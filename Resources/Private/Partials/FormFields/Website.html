<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbContacts="http://typo3.org/ns/PSB/PsbContacts/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/website.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Frontend/Contact/edit.xlf" />

<f:if condition="{record}">
    <f:then>
        <f:variable
            name="uid"
            value="{record.uid}" />
    </f:then>
    <f:else>
        <f:variable
            name="uid"
            value="###uid###" />
    </f:else>
</f:if>

<div class="form-floating mb-3">
    <f:form.select
        class="form-select"
        name="website[{uid}][type]"
        value="{record.type.value}">
        <f:for
            as="label"
            each="{generalTypes}"
            key="value">
            <f:form.select.option value="{value}">
                <psbFoundation:translate id="website:type.{value}" />
            </f:form.select.option>
        </f:for>
    </f:form.select>
    <label
        class="form-label">
        <psbFoundation:translate id="website:type" />
    </label>
</div>
<div class="form-floating mb-3">
    <f:form.textfield
        class="form-control"
        name="website[{uid}][url]"
        placeholder="{psbFoundation:translate(id: 'website:url')}"
        type="url"
        value="{record.url}" />
    <label
        class="form-label">
        <psbFoundation:translate id="website:url" />
    </label>
</div>
<div class="form-floating mb-3">
    <input
        autocomplete="off"
        class="form-control js-clear-input"
        data-psb-autocomplete-items="{allContacts}"
        data-psb-autocomplete-preselection="{psbContacts:json.relatedContacts(relatedEntity: record, contact: contact)}"
        data-psb-autocomplete-selection-target="#contact-selection-{uid}"
        data-psb-autocomplete-value-target="#contact-value-{uid}"
        placeholder="{psbFoundation:translate(id: 'edit:additionalContacts.website')}"
        type="text" />
    <label
        class="form-label">
        <psbFoundation:translate id="edit:additionalContacts.website" />
    </label>
    <ul
        class="list-group list-group-flush"
        id="contact-selection-{uid}">
    </ul>
    <f:form.hidden
        id="contact-value-{uid}"
        name="website[{uid}][contacts]" />
</div>
<div class="form-floating mb-3">
    <f:form.textarea
        class="form-control"
        name="website[{uid}][notes]"
        placeholder="{psbFoundation:translate(id: 'website:notes')}"
        value="{record.notes}" />
    <label
        class="form-label">
        <psbFoundation:translate id="website:notes" />
    </label>
</div>
<div
    class="btn btn-danger"
    data-psb-delete-mode="closest"
    data-psb-delete-target=".accordion-item">
    <psbFoundation:translate id="edit:remove" />
</div>
</html>
