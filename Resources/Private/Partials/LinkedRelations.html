<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
    <ul class="list-group list-group-flush">
        <f:for
            as="record"
            each="{records}">
            <li class="d-flex list-group-item list-group-item-action p-0">
                <a
                    class="d-block flex-grow-1 p-2 text-decoration-none text-reset"
                    href="{record.link}"
                    target="{linkTarget}">
                    <div class="d-flex">
                        <f:if condition="{record.phoneNumberType}">
                            <f:then>
                                <core:icon
                                    identifier="frontend-templates-{record.generalType.iconIdentifier}"
                                    size="small" />
                                <span class="ms-1">
                                    <core:icon
                                        identifier="frontend-templates-{record.phoneNumberType.iconIdentifier}"
                                        size="small" />
                                </span>
                            </f:then>
                            <f:else if="{record.typeIconIdentifier}">
                                <core:icon
                                    identifier="frontend-templates-{record.typeIconIdentifier}"
                                    size="small" />
                            </f:else>
                            <f:else>
                                <core:icon
                                    identifier="frontend-templates-{record.type.iconIdentifier}"
                                    size="small" />
                            </f:else>
                        </f:if>

                        <div class="ms-2">
                            <f:render
                                arguments="{record: record}"
                                default="{record.compactValue}"
                                optional="true"
                                partial="{record.recordType}" />

                            <f:if condition="{record.notes}">
                                <div class="mt-1 small text-muted">
                                    {record.notes -> f:format.nl2br()}
                                </div>
                            </f:if>
                        </div>
                    </div>
                </a>

                <f:if condition="{showActionIcon}">
                    <a
                        class="p-2"
                        href="{record.link}"
                        target="{linkTarget}">
                        <core:icon
                            identifier="frontend-templates-{record.actionIconIdentifier}"
                            size="small" />
                    </a>
                </f:if>
            </li>
        </f:for>
    </ul>
</html>
