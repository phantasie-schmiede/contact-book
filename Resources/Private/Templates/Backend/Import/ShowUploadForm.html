<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<f:layout name="Module" />

<f:section name="Content">
    <div class="row">
        <div class="col">
            <h1>
                <psbFoundation:translate id="header" />
            </h1>
            <f:form
                action="import"
                enctype="multipart/form-data"
                method="post">
                <f:form.upload
                    class="form-control"
                    name="contactsFile" />
                <f:form.submit
                    class="bg-primary-subtle btn mt-3 text-white"
                    value="{psbFoundation:translate(id: 'submit')}" />
            </f:form>
            <div class="mt-3">
                <f:flashMessages />
            </div>
        </div>
    </div>
</f:section>
</html>
