<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers"
    xmlns:templates="http://typo3.org/ns/PSBits/Templates/ViewHelpers">
<foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Frontend/form.xlf" />

<f:render
    arguments="{contact: contact, loadCompanies: true, loadContacts: true}"
    partial="AjaxRequests" />

<f:form
    action="update"
    enctype="multipart/form-data"
    method="post"
    name="contact"
    object="{contact}">
    <f:render
        arguments="{_all}"
        partial="FormFields/Contact" />

    <div class="col-12 d-flex mt-3">
        <f:variable
            name="buttonLabel"
            value="{templates:svgIcon(additionalClasses: 'me-2', identifier: 'templates-x-lg')}{foundation:translate(id: 'form:cancel')}" />

        <f:render
            arguments="{class: 'align-items-center bg-secondary-subtle btn d-flex', contact: contact, label: buttonLabel}"
            partial="Link/Contact" />
        <templates:component.button
            additionalClasses="bg-primary-subtle ms-2"
            iconIdentifier="templates-floppy"
            label="{foundation:translate(id: 'form:save')}"
            spinnerText="{foundation:translate(id: 'form:submit.loadingSpinner')}"
            type="submit" />
    </div>
</f:form>

<f:render
    arguments="{_all}"
    partial="ContactRelationTemplates" />
</html>
