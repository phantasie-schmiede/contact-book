<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<f:form
    action="update"
    class="contact-form"
    enctype="multipart/form-data"
    method="post"
    name="contact"
    object="{contact}">
    <f:render
        arguments="{_all}"
        partial="FormFields/Contact" />

    <div class="col-12 mt-3">
        <f:link.action
            action="show"
            arguments="{contact: contact}"
            class="btn btn-secondary">
            <psbFoundation:translate id="cancel" />
        </f:link.action>
        <button
            class="btn btn-primary"
            type="submit">
            <psbFoundation:translate id="save" />
        </button>
    </div>
</f:form>

<f:render
    arguments="{_all}"
    partial="ContactRelationTemplates" />
</html>
