<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<div class="mb-2 row">
    <div class="col-12 d-flex justify-content-end">
        <f:link.action
            action="export"
            class="bg-secondary-subtle btn"
            title="{psbFoundation:translate(id: 'exportVCard')}">
            <core:icon
                identifier="psb-templates-download"
                size="small" />
        </f:link.action>
        <f:link.action
            action="new"
            class="bg-primary-subtle btn ms-2"
            title="{psbFoundation:translate(id: 'addNewContact')}">
            <core:icon
                identifier="psb-templates-person-add"
                size="small" />
        </f:link.action>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <f:render
            arguments="{contacts: contacts, pluginUid: pluginUid}"
            partial="ContactList" />
    </div>
</div>
</html>
