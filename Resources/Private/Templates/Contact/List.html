<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
<foundation:translation.registerLanguageFile file="EXT:templates/Resources/Private/Language/Frontend/Component/loadingSpinner.xlf" />

<f:asset.script
    identifier="loadingSpinner"
    src="EXT:templates/Resources/Public/JavaScript/loadingSpinner.js"
    type="module" />

<div class="mb-2 row">
    <div class="col-12 d-flex justify-content-end">
        <f:render partial="ExportModal/Toggle" />

        <f:link.action
            action="new"
            class="bg-primary-subtle btn ms-2"
            data="{
                psbits-spinner-text-hidden: '{foundation:translate(id: \'loadingSpinner:pageLoading\')}',
                psbits-spinner-phase-out: ''
            }"
            title="{foundation:translate(id: 'addNewContact')}">
            <core:icon
                identifier="templates-person-add"
                size="small" />
        </f:link.action>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <f:render
            arguments="{
                list: list,
                pluginUid: pluginUid,
                refreshUrl: '{f:uri.action(action: \'refreshList\', controller: \'Contact\', pageType: 1749246027, pluginName: \'ContactListAjaxRefresh\')}'
            }"
            partial="SearchableContactList" />
    </div>
</div>

<f:render partial="ExportModal/Dialog" />
</html>
