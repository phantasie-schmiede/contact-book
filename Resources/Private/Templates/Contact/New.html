<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers"
    xmlns:frontendTemplates="http://typo3.org/ns/PSBits/FrontendTemplates/ViewHelpers">
    <f:layout name="Default" />

    <f:section name="Main">
        <foundation:translation.registerLanguageFile
            file="EXT:frontend_templates/Resources/Private/Language/Frontend/form.xlf" />

        <f:render
            arguments="{contact: contact, loadCompanies: true, loadContacts: true}"
            partial="AjaxRequests" />

        <f:form
            action="create"
            enctype="multipart/form-data"
            method="post"
            name="contact"
            object="{contact}">
            <f:render
                arguments="{_all}"
                partial="FormFields/Contact" />

            <f:render
                contentAs="buttons"
                partial="Component/ButtonRow">
                <frontendTemplates:component.button
                    additionalClasses="bg-secondary-subtle"
                    href="{f:uri.action(action: 'list')}"
                    iconIdentifier="frontend-templates-x-lg"
                    label="{foundation:translate(id: 'form:cancel')}"
                    spinnerText="{foundation:translate(id: 'form:cancel')}"
                    tag="a" />
                <frontendTemplates:component.button
                    additionalClasses="bg-primary-subtle ms-2"
                    iconIdentifier="frontend-templates-floppy"
                    label="{foundation:translate(id: 'form:save')}"
                    spinnerText="{foundation:translate(id: 'form:submit.loadingSpinner')}"
                    type="submit" />
            </f:render>
        </f:form>

        <f:render
            arguments="{_all}"
            partial="ContactRelationTemplates" />
    </f:section>
</html>
