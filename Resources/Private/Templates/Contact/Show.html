<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers"
    xmlns:psbTemplates="http://typo3.org/ns/PSB/PsbTemplates/ViewHelpers"
    xmlns:psbvh="http://typo3.org/ns/PSB/PsbViewHelpers/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/address.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/contact.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/eMail.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/event.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/phoneNumber.xlf" />
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/website.xlf" />

<div class="row">
    <div class="col-12">
        <dl class="row">
            <f:if condition="{contact.firstName}">
                <dt class="col-3">
                    <psbFoundation:translate id="contact:firstName" />
                </dt>
                <dd class="col-9">{contact.firstName}</dd>
            </f:if>

            <f:if condition="{contact.middleNames}">
                <dt class="col-3">
                    <psbFoundation:translate id="contact:middleNames" />
                </dt>
                <dd class="col-9">{contact.middleNames}</dd>
            </f:if>

            <f:if condition="{contact.lastName}">
                <dt class="col-3">
                    <psbFoundation:translate id="contact:lastName" />
                </dt>
                <dd class="col-9">{contact.lastName}</dd>
            </f:if>

            <f:if condition="{contact.companyName}">
                <dt class="col-3">
                    <psbFoundation:translate id="contact:companyName" />
                </dt>
                <dd class="col-9">{contact.companyName}</dd>
            </f:if>

            <f:if condition="{contact.addresses}">
                <dt class="col-3">
                    <psbFoundation:translate id="contact:addresses" />
                </dt>
                <dd class="col-9">
                    <ul>
                        <f:for
                            as="address"
                            each="{contact.addresses}">
                            <li>
                                <strong>
                                    <psbFoundation:translate id="address:type.{address.type.value}" />
                                </strong>
                                {address.street} {address.houseNumber}
                                <br>

                                <f:if condition="{address.zipCode}">
                                    {address.zipCode}
                                </f:if>

                                {address.city}
                                <br>

                                <f:if condition="{address.county}">
                                    {address.county},
                                </f:if>

                                <psbTemplates:data.countryNames countryCode="{address.country}" />
                            </li>
                        </f:for>
                    </ul>
                </dd>
            </f:if>

            <f:if condition="{contact.phoneNumbers}">
                <dt class="col-3">
                    <psbFoundation:translate id="contact:phoneNumbers" />
                </dt>
                <dd class="col-9">
                    <ul>
                        <f:for
                            as="phoneNumber"
                            each="{contact.phoneNumbers}">
                            <li>
                                <strong>
                                    <psbFoundation:translate id="phoneNumber:phoneNumberType.{phoneNumber.phoneNumberType.value}" />
                                    (<psbFoundation:translate id="phoneNumber:generalType.{phoneNumber.generalType.value}" />)
                                </strong>
                                <span>
                                    <f:variable
                                        name="phoneNumberLabelId"
                                        value="formattedPhoneNumber.international" />

                                    <f:if condition="{phoneNumber.extension}">
                                        <f:variable
                                            name="phoneNumberLabelId"
                                            value="{phoneNumberLabelId}.withExtension" />
                                    </f:if>

                                    <a href="tel:{phoneNumber.completeNumber}">
                                        <psbFoundation:translate
                                            arguments="{areaCode: phoneNumber.areaCode, connectionIdentifier: phoneNumber.connectionIdentifier, extension: phoneNumber.extension, internationalDiallingCode: phoneNumber.internationalDiallingCode}"
                                            id="{phoneNumberLabelId}" />
                                    </a>
                                </span>
                            </li>
                        </f:for>
                    </ul>
                </dd>
            </f:if>

            <f:if condition="{contact.eMails}">
                <dt class="col-3">
                    <psbFoundation:translate id="contact:eMails" />
                </dt>
                <dd class="col-9">
                    <ul>
                        <f:for
                            as="eMail"
                            each="{contact.eMails}">
                            <li>
                                <strong>
                                    <psbFoundation:translate id="eMail:type.{eMail.type.value}" />
                                </strong>
                                <span>{eMail.eMailAddress}</span>
                            </li>
                        </f:for>
                    </ul>
                </dd>
            </f:if>

            <f:if condition="{contact.websites}">
                <dt class="col-3">
                    <psbFoundation:translate id="contact:websites" />
                </dt>
                <dd class="col-9">
                    <ul>
                        <f:for
                            as="website"
                            each="{contact.websites}">
                            <li>
                                <strong>
                                    <psbFoundation:translate id="website:type.{website.type.value}" />
                                </strong>
                                <span>{website.url}</span>
                            </li>
                        </f:for>
                    </ul>
                </dd>
            </f:if>

            <f:if condition="{contact.events}">
                <dt class="col-3">
                    <psbFoundation:translate id="contact:events" />
                </dt>
                <dd class="col-9">
                    <ul>
                        <f:for
                            as="event"
                            each="{contact.events}">
                            <li>
                                <strong>
                                    <psbFoundation:translate id="event:type.{event.type.value}" />
                                </strong>
                                <span>{event.date -> f:format.date(format: 'd.m.Y')}</span>
                            </li>
                        </f:for>
                    </ul>
                </dd>
            </f:if>
        </dl>

        <psbTemplates:additionalContent
            eventClass="{psbvh:variable.convertString(string: 'PSB\PsbContacts\Event\AdditionalContactContentEvent::class')}"
            parameters="{contact: contact}" />
    </div>
</div>

<div class="row">
    <div class="bg-secondary col-md-4 d-flex justify-content-center p-2 position-relative ">
        <f:link.action
            action="list"
            class="link-light link-underline-opacity-0 link-underline-opacity-100-hover stretched-link">
            <psbFoundation:translate id="backToList" />
        </f:link.action>
    </div>

    <div class="bg-primary col-md-4 d-flex justify-content-center p-2 position-relative ">
        <f:link.action
            action="edit"
            arguments="{contact: contact}"
            class="link-light link-underline-opacity-0 link-underline-opacity-100-hover stretched-link">
            <psbFoundation:translate id="edit" />
        </f:link.action>
    </div>

    <div class="bg-danger col-md-4 d-flex justify-content-center p-2 position-relative">
        <f:link.action
            action="confirmDelete"
            arguments="{contact: contact}"
            class="link-light link-underline-opacity-0 link-underline-opacity-100-hover stretched-link"
            data="{psb-modal: '#dynamic-modal'}"
            pageType="{psbvh:variable.convertString(string: '\PSB\PsbContacts\Data\ExtensionInformation::TYPE_NUMS[ConfirmDeleteContact]')}"
            pluginName="ConfirmDeleteContact">
            <psbFoundation:translate id="delete" />
        </f:link.action>
    </div>
</div>

<section name="FooterAssets">
    <f:asset.script
        identifier="dynamicModal"
        src="EXT:psb_templates/Resources/Public/JavaScript/dynamicModal.js"
        type="module" />
</section>
</html>
