<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers"
    xmlns:psbTemplates="http://typo3.org/ns/PSB/PsbTemplates/ViewHelpers"
    xmlns:psbvh="http://typo3.org/ns/PSB/PsbViewHelpers/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Backend/Configuration/TCA/contact.xlf" />
<psbFoundation:translation.registerLanguageFile
    file="EXT:psb_contacts/Resources/Private/Language/Frontend/confirmDeleteModal.xlf"
    name="modal" />

<f:asset.script
    identifier="dynamicModal"
    src="EXT:psb_templates/Resources/Public/JavaScript/dynamicModal.js"
    type="module" />

<div class="row">
    <div class="col-12">
        <f:if condition="{contact.images}">
            <div class="mb-3">
                <f:render
                    arguments="{configuration: {
                        autoHeight: true,
                        navigation: true
                    },
                    id: 'contact-images'}"
                    contentAs="slides"
                    partial="Component/Swiper">
                    <f:for
                        as="document"
                        each="{contact.images}">
                        <f:image
                            class="swiper-slide"
                            image="{document.file}" />
                    </f:for>
                </f:render>
            </div>
        </f:if>

        <h1>{contact.fullName}</h1>

        <f:if condition="{contact.nickname}">
            <h2>&raquo;{contact.nickname}&laquo;</h2>
        </f:if>

        <f:if condition="{contact.notes}">
            <h3 class="mt-3">
                <psbFoundation:translate id="contact:notes" />
            </h3>
            <p>
                <f:format.nl2br>{contact.notes}</f:format.nl2br>
            </p>
        </f:if>

        <f:if condition="{contact.companies}">
            <h3 class="mt-3">
                <psbFoundation:translate id="contact:companies" />
            </h3>
            <ul class="list-group list-group-flush">
                <f:for
                    as="company"
                    each="{contact.companies}">
                    <f:link.action
                        action="show"
                        arguments="{contact: company}"
                        class="list-group-item list-group-item-action">
                        {company.companyName}
                    </f:link.action>
                </f:for>
            </ul>
        </f:if>

        <f:if condition="{contact.addresses}">
            <h3 class="mt-3">
                <psbFoundation:translate id="contact:addresses" />
            </h3>
            <f:render
                arguments="{records: contact.addresses, showActionIcon: true}"
                partial="LinkedRelations" />
        </f:if>

        <f:if condition="{contact.phoneNumbers}">
            <h3 class="mt-3">
                <psbFoundation:translate id="contact:phoneNumbers" />
            </h3>
            <f:render
                arguments="{records: contact.phoneNumbers, showActionIcon: true}"
                partial="LinkedRelations" />
        </f:if>

        <f:if condition="{contact.eMails}">
            <h3 class="mt-3">
                <psbFoundation:translate id="contact:eMails" />
            </h3>
            <f:render
                arguments="{records: contact.eMails, showActionIcon: true}"
                partial="LinkedRelations" />
        </f:if>

        <f:if condition="{contact.websites}">
            <h3 class="mt-3">
                <psbFoundation:translate id="contact:websites" />
            </h3>
            <f:render
                arguments="{linkTarget: '_blank', records: contact.websites, showActionIcon: true}"
                partial="LinkedRelations" />
        </f:if>

        <f:if condition="{contact.documentsWithoutImages}">
            <h3 class="mt-3">
                <psbFoundation:translate id="contact:documents" />
            </h3>
            <f:render
                arguments="{linkTarget: '_blank', records: contact.documentsWithoutImages, showActionIcon: true}"
                partial="LinkedRelations" />
        </f:if>

        <f:if condition="{contact.eventsInDescendingOrder}">
            <h3 class="mt-3">
                <psbFoundation:translate id="contact:events" />
            </h3>
            <ul class="list-group list-group-flush">
                <f:for
                    as="event"
                    each="{contact.eventsInDescendingOrder}">
                    <li class="d-flex list-group-item">
                        <span>
                            <f:variable
                                name="dateFormat"
                                value="{f:if(condition: event.yearUnknown, then: 'd.m.', else: 'd.m.Y')}" />

                            {event.date -> f:format.date(format: dateFormat)}
                        </span>
                        <span class="fw-bold ms-2">
                            {event.label}
                        </span>
                        <psbTemplates:additionalContent
                            eventClass="{psbvh:variable.convertString(string: 'PSB\PsbContacts\Event\AdditionalEventListContentEvent::class')}"
                            parameters="{event: event}" />
                    </li>
                </f:for>
            </ul>
        </f:if>

        <psbTemplates:additionalContent
            eventClass="{psbvh:variable.convertString(string: 'PSB\PsbContacts\Event\AdditionalContactContentEvent::class')}"
            parameters="{contact: contact}" />
    </div>
</div>

<div class="d-flex mt-3">
    <f:link.action
        action="list"
        class="bg-secondary-subtle btn me-2">
        <core:icon
            identifier="psb-templates-arrow-left"
            size="small" />
        <psbFoundation:translate id="backToList" />
    </f:link.action>

    <f:link.action
        action="edit"
        arguments="{contact: contact}"
        class="bg-primary-subtle btn">
        <core:icon
            identifier="psb-templates-pencil"
            size="small" />
        <psbFoundation:translate id="edit" />
    </f:link.action>

    <a
        class="bg-danger btn ms-auto rounded-circle"
        data-bs-target="#delete-contact-{contact.uid}-modal"
        data-bs-toggle="modal"
        href="#">
        <core:icon
            identifier="psb-templates-trash"
            size="small"
            title="{psbFoundation:translate(id: 'delete')}" />
    </a>
</div>

<div
    aria-labelledby="delete-contact-{contact.uid}-modal-label"
    aria-modal="true"
    class="fade modal"
    id="delete-contact-{contact.uid}-modal"
    role="dialog"
    tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1
                    class="modal-title fs-5"
                    id="delete-contact-{contact.uid}-modal-label">
                    <psbFoundation:translate id="modal:title" />
                </h1>
                <button
                    aria-label="Close"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    type="button"></button>
            </div>
            <div class="modal-body">
                <psbFoundation:translate
                    arguments="{name: contact.displayName}"
                    id="modal:body" />
            </div>
            <div class="modal-footer">
                <button
                    class="bg-secondary-subtle btn"
                    data-bs-dismiss="modal"
                    type="button">
                    <psbFoundation:translate id="modal:cancel" />
                </button>
                <f:link.action
                    action="delete"
                    arguments="{contact: contact}"
                    class="btn btn-danger">
                    <psbFoundation:translate id="modal:delete" />
                </f:link.action>
            </div>
        </div>
    </div>
</div>
</html>
