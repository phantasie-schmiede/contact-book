<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:contactBook="http://typo3.org/ns/PSBits/ContactBook/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers"
    xmlns:psbvh="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers"
    xmlns:templates="http://typo3.org/ns/PSBits/Templates/ViewHelpers">
<foundation:translation.registerLanguageFile
    file="EXT:contact_book/Resources/Private/Language/Frontend/confirmDeleteModal.xlf"
    name="modal" />
<foundation:translation.registerLanguageFile file="EXT:templates/Resources/Private/Language/Frontend/Component/loadingSpinner.xlf" />

<f:asset.script
    identifier="loadingSpinner"
    src="EXT:templates/Resources/Public/JavaScript/loadingSpinner.js"
    type="module" />

<f:variable
    name="tabAddressesContent"
    value="{f:render(arguments: {linkTarget: '_blank', records: contact.addresses}, section: 'TabLinkedRelationsContent')}" />
<f:variable
    name="tabAddressesLabel"
    value="{f:render(arguments: {identifier: 'geo-alt'}, section: 'Icon')}" />
<f:variable
    name="tabDocumentsContent"
    value="{f:render(arguments: {linkTarget: '_blank', records: contact.documents}, section: 'TabLinkedRelationsContent')}" />
<f:variable
    name="tabDocumentsLabel"
    value="{f:render(arguments: {identifier: 'files'}, section: 'Icon')}" />
<f:variable
    name="tabEMailsContent"
    value="{f:render(arguments: {records: contact.eMails}, section: 'TabLinkedRelationsContent')}" />
<f:variable
    name="tabEMailsLabel"
    value="{f:render(arguments: {identifier: 'envelope-at'}, section: 'Icon')}" />
<f:variable
    name="tabEventsContent"
    value="{f:render(arguments: {contact: contact}, section: 'TabEventsContent')}" />
<f:variable
    name="tabEventsLabel"
    value="{f:render(arguments: {identifier: 'calendar-event'}, section: 'Icon')}" />
<f:variable
    name="tabNameContent"
    value="{f:render(arguments: {contact: contact}, section: 'TabNameContent')}" />
<f:variable
    name="tabNameLabel"
    value="{f:render(arguments: {identifier: 'tag'}, section: 'Icon')}" />
<f:variable
    name="tabOtherContent"
    value="{f:render(arguments: {allContactGroups: allContactGroups, contact: contact}, section: 'TabOtherContent')}" />
<f:variable
    name="tabOtherLabel"
    value="{f:render(arguments: {identifier: 'three-dots'}, section: 'Icon')}" />
<f:variable
    name="tabPhoneNumbersContent"
    value="{f:render(arguments: {records: contact.phoneNumbers}, section: 'TabLinkedRelationsContent')}" />
<f:variable
    name="tabPhoneNumbersLabel"
    value="{f:render(arguments: {identifier: 'telephone'}, section: 'Icon')}" />
<f:variable
    name="tabWebsitesContent"
    value="{f:render(arguments: {linkTarget: '_blank', records: contact.websites}, section: 'TabLinkedRelationsContent')}" />
<f:variable
    name="tabWebsitesLabel"
    value="{f:render(arguments: {identifier: 'globe'}, section: 'Icon')}" />
<f:variable
    name="tabWorkContent"
    value="{f:render(arguments: {contact: contact}, section: 'TabWorkContent')}" />
<f:variable
    name="tabWorkLabel"
    value="{f:render(arguments: {identifier: 'briefcase'}, section: 'Icon')}" />

<div class="contact-show row">
    <div class="col-12">
        <f:if condition="{contact.images}">
            <div class="mb-3">
                <f:render
                    arguments="{
                        configuration: {
                            autoHeight: true,
                            navigation: true
                        },
                        id: 'contact-images'
                    }"
                    contentAs="slides"
                    partial="Component/Swiper">
                    <f:for
                        as="document"
                        each="{contact.images}">
                        <f:image
                            class="swiper-slide"
                            image="{document.file}" />
                    </f:for>
                </f:render>
            </div>
        </f:if>

        <h1 class="d-flex justify-content-between">
            {contact.shortName}
            <f:render partial="ExportModal/Toggle" />
        </h1>

        <hr>

        <f:render
            arguments="{
                tabClass: 'px-1',
                tabs: '{
                    0: {
                        content: tabNameContent,
                        id: \'name\',
                        label: tabNameLabel
                    },
                    1: {
                        content: tabWorkContent,
                        id: \'work\',
                        label: tabWorkLabel
                    },
                    2: {
                        content: tabAddressesContent,
                        id: \'addresses\',
                        label: tabAddressesLabel
                    },
                    3: {
                        content: tabPhoneNumbersContent,
                        id: \'phone-numbers\',
                        label: tabPhoneNumbersLabel
                    },
                    4: {
                        content: tabEMailsContent,
                        id: \'e-mails\',
                        label: tabEMailsLabel
                    },
                    5: {
                        content: tabWebsitesContent,
                        id: \'websites\',
                        label: tabWebsitesLabel
                    },
                    6: {
                        content: tabEventsContent,
                        id: \'events\',
                        label: tabEventsLabel
                    },
                    7: {
                        content: tabDocumentsContent,
                        id: \'documents\',
                        label: tabDocumentsLabel
                    },
                    8: {
                        content: tabOtherContent,
                        id: \'other\',
                        label: tabOtherLabel
                    }
                }',
                vertical: true,
            }"
            partial="Component/Tabs" />

        <templates:additionalContent
            eventClass="{psbvh:variable.convertString(string: 'PSBits\ContactBook\Event\AdditionalContactContentEvent::class')}"
            parameters="{contact: contact}" />
    </div>
</div>

<div class="d-flex mt-3">
    <f:link.action
        action="list"
        class="bg-secondary-subtle btn me-2">
        <core:icon
            identifier="templates-arrow-left"
            size="small" />
        <foundation:translate id="backToList" />
    </f:link.action>

    <f:link.action
        action="edit"
        arguments="{contact: contact}"
        class="bg-primary-subtle btn"
        data-psbits-spinner-text-hidden="{foundation:translate(id: 'loadingSpinner:pageLoading')}">
        <span data-psbits-spinner-phase-out>
            <core:icon
                identifier="templates-pencil"
                size="small" />
        </span>
        <foundation:translate id="edit" />
    </f:link.action>

    <f:render
        arguments="{
            classes: 'bg-danger btn ms-auto',
            modalId: 'delete-contact-{contact.uid}-modal',
            text: '{templates:svgIcon(identifier: \'templates-trash\')}',
            title: '{foundation:translate(id: \'delete\')}'
        }"
        partial="Component/Modal/Toggle" />
</div>

<f:render
    arguments="{
        body: '{foundation:translate(arguments: {name: contact.fullName}, id: \'modal:body\')}',
        footer: '{f:render(arguments: {contact: contact}, section: \'ModalFooter\')}',
        id: 'delete-contact-{contact.uid}-modal',
        title: '{foundation:translate(id: \'modal:title\')}'
    }"
    partial="Component/Modal/Dialog" />

<f:render
    arguments="{contact: contact}"
    partial="ExportModal/Dialog" />

<f:section name="Colleagues">
    <ul class="list-group list-group-flush">
        <f:for
            as="colleague"
            each="{colleagues}">
            <f:render
                arguments="{class: 'list-group-item list-group-item-action', contact: colleague}"
                partial="Link/Contact" />
        </f:for>
    </ul>
</f:section>

<f:section name="Icon">
    <core:icon
        identifier="templates-{identifier}"
        size="medium" />
</f:section>

<f:section name="ModalFooter">
    <foundation:translation.registerLanguageFile
        file="EXT:contact_book/Resources/Private/Language/Frontend/confirmDeleteModal.xlf"
        name="modal" />

    <button
        class="bg-secondary-subtle btn"
        data-bs-dismiss="modal"
        type="button">
        <foundation:translate id="modal:cancel" />
    </button>
    <f:link.action
        action="delete"
        arguments="{contact: contact}"
        class="btn btn-danger">
        <foundation:translate id="modal:delete" />
    </f:link.action>
</f:section>

<f:section name="TabLinkedRelationsContent">
    <f:if condition="{records}">
        <f:render
            arguments="{linkTarget: linkTarget, records: records, showActionIcon: true}"
            partial="LinkedRelations" />
    </f:if>
</f:section>

<f:section name="TabEventsContent">
    <f:if condition="{contact.eventsInDescendingOrder}">
        <f:render
            contentAs="content"
            partial="Component/LabelledList">
            <f:for
                as="event"
                each="{contact.eventsInDescendingOrder}">
                <f:render
                    arguments="{valueClass: 'd-flex', label: event.dateFormatted}"
                    contentAs="value"
                    partial="Component/LabelledListItem">
                    <f:if condition="!{event.year}">
                        <f:then>
                            {event.label}
                        </f:then>
                        <f:else>
                            {event.type.label}
                        </f:else>
                    </f:if>

                    <f:if condition="('divorce' == {event.type.value} || 'wedding' == {event.type.value}) && {event.contacts}">
                        <f:variable
                            name="spouse"
                            value="{contactBook:event.otherContacts(contact: contact, event: event, returnFirst: 'true')}" />

                        <foundation:translate id="dyn.event.otherContactPreposition.{event.type.value}" />
                        <f:link.action
                            action="show"
                            arguments="{contact: spouse}">
                            {spouse.shortName}

                            <f:if condition="{spouse.birthName}">
                                (<foundation:translate
                                arguments="{birthName: spouse.birthName}"
                                id="birthName" />)
                            </f:if>
                        </f:link.action>
                    </f:if>

                    <f:if condition="{event.location}">
                        in {event.location}
                    </f:if>

                    <f:if condition="{event.notes}">
                        ({event.notesInline})
                    </f:if>

                    <templates:additionalContent
                        eventClass="{psbvh:variable.convertString(string: 'PSBits\ContactBook\Event\AdditionalEventListContentEvent::class')}"
                        parameters="{event: event}" />
                </f:render>
            </f:for>
        </f:render>
    </f:if>
</f:section>

<f:section name="TabNameContent">
    <f:render
        contentAs="content"
        partial="Component/LabelledList">
        <f:render
            arguments="{label: 'Vollständiger Name:'}"
            contentAs="value"
            partial="Component/LabelledListItem">
            {contact.fullName}
        </f:render>

        <f:if condition="{contact.birthName}">
            <f:render
                arguments="{label: 'Geburtsname'}"
                contentAs="value"
                partial="Component/LabelledListItem">
                {contact.birthName}
            </f:render>
        </f:if>

        <f:if condition="{contact.nickname}">
            <f:render
                arguments="{label: 'Spitzname:'}"
                contentAs="value"
                partial="Component/LabelledListItem">
                {contact.nickname}
            </f:render>
        </f:if>
    </f:render>
</f:section>

<f:section name="TabOtherContent">
    <foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Backend/Configuration/TCA/contact.xlf" />

    <f:if condition="{contact.notes}">
        <h3>
            <foundation:translate id="contact:notes" />
        </h3>
        <p>
            <f:format.nl2br>{contact.notes}</f:format.nl2br>
        </p>
    </f:if>

    <f:if condition="{contact.contactGroups}">
        <h3>
            <foundation:translate id="contact:contactGroups" />
        </h3>
        <ul class="list-group list-group-flush">
            <f:for
                as="contactGroup"
                each="{contact.contactGroups}">
                <f:render
                    arguments="{class: 'list-group-item list-group-item-action', contactGroup: contactGroup}"
                    partial="Link/ContactGroup" />
            </f:for>
        </ul>
    </f:if>
</f:section>

<f:section name="TabWorkContent">
    <foundation:translation.registerLanguageFile file="EXT:contact_book/Resources/Private/Language/Backend/Configuration/TCA/contact.xlf" />

    <f:if condition="{contact.jobs}">
        <h3 class="mb-3">
            <foundation:translate id="{f:if(condition: contact.ofTypePerson, then: 'contact:jobs', else: 'contact.employees')}" />
        </h3>
        <f:for
            as="job"
            each="{contact.jobs}"
            iteration="jobIterator">
            <div class="card{f:if(condition: jobIterator.isLast, else: ' mb-3')}">
                <div class="card-body">
                    <f:if condition="{job.company}">
                        {job.company.fullName} -
                    </f:if>

                    <f:if condition="{job.position}">
                        {job.position}
                    </f:if>

                    <f:if condition="{job.role}">
                        {job.role}
                    </f:if>

                    <f:if condition="{job.notes}">
                        {job.notes -> f:format.nl2br()}
                    </f:if>
                </div>
            </div>
        </f:for>
    </f:if>
</f:section>
</html>
