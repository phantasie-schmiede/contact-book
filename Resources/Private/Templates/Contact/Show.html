<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbvh="http://typo3.org/ns/PSB/PsbViewHelpers/ViewHelpers">
<div class="row">
    <div class="col-12">
        <dl class="row">
            <f:if condition="{contact.firstName}">
                <dt class="col-3">Vorname</dt>
                <dd class="col-9">{contact.firstName}</dd>
            </f:if>

            <f:if condition="{contact.middleNames}">
                <dt class="col-3">weitere Vornamen</dt>
                <dd class="col-9">{contact.middleNames}</dd>
            </f:if>

            <f:if condition="{contact.lastName}">
                <dt class="col-3">Nachname</dt>
                <dd class="col-9">{contact.lastName}</dd>
            </f:if>

            <f:if condition="{contact.companyName}">
                <dt class="col-3">Unternehmensname</dt>
                <dd class="col-9">{contact.companyName}</dd>
            </f:if>

        </dl>
    </div>
</div>

<div class="row">
    <div class="bg-secondary col-md-4 d-flex justify-content-center p-2 position-relative ">
        <f:link.action
            action="list"
            class="link-light link-underline-opacity-0 link-underline-opacity-100-hover stretched-link">
            Zurück zur Liste
        </f:link.action>
    </div>

    <div class="bg-primary col-md-4 d-flex justify-content-center p-2 position-relative ">
        <f:link.action
            action="edit"
            arguments="{contact: contact}"
            class="link-light link-underline-opacity-0 link-underline-opacity-100-hover stretched-link">
            Bearbeiten
        </f:link.action>
    </div>

    <div class="bg-danger col-md-4 d-flex justify-content-center p-2 position-relative">
        <f:link.action
            action="confirmDelete"
            arguments="{contact: contact}"
            class="link-light link-underline-opacity-0 link-underline-opacity-100-hover stretched-link"
            data="{psb-modal: '#dynamicModal'}"
            pageType="{psbvh:variable.convertString(string: '\PSB\PsbContacts\Data\ExtensionInformation::TYPE_NUMS[ConfirmDeleteContact]')}"
            pluginName="ConfirmDeleteContact">
            Löschen
        </f:link.action>
    </div>
</div>

<section name="FooterAssets">
    <f:asset.script
        identifier="dynamicModal"
        src="EXT:psb_templates/Resources/Public/JavaScript/dynamicModal.js"
        type="module" />
</section>
</html>
