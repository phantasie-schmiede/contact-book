<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
<f:if condition="{contactBooks}">
    <f:then>
        <ul class="list-group list-group-flush">
            <f:for
                as="contactBook"
                each="{contactBooks}">
                <f:link.action
                    action="show"
                    arguments="{contactBook: contactBook}"
                    class="list-group-item list-group-item-action">
                    {contactBook.name}
                </f:link.action>
            </f:for>
        </ul>
    </f:then>
    <f:else>
        <div class="alert alert-info">
            <foundation:translate id="noContactBooks" />
        </div>
    </f:else>
</f:if>

<f:link.action
    action="new"
    class="bg-primary-subtle btn mt-3">
    <core:icon
        identifier="templates-plus-lg"
        size="small" />
    <foundation:translate id="createContactBook.{f:if(condition: contactBooks, then: 'additional', else: 'first')}" />
</f:link.action>
</html>
