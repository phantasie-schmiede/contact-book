<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers"
    xmlns:psbTemplates="http://typo3.org/ns/PSB/PsbTemplates/ViewHelpers">
<psbFoundation:translation.registerLanguageFile
    file="EXT:psb_contacts/Resources/Private/Language/Frontend/confirmDeleteModal.xlf"
    name="modal" />

<div class="row">
    <div class="col-12">
        <h1 class="d-flex justify-content-between">
            {contactGroup.name}
            <f:render partial="ExportModal/Toggle" />
        </h1>
        <f:render
            arguments="{contacts: contactGroup.contactsSorted}"
            partial="ContactList" />
    </div>
</div>

<div class="d-flex mt-3">
    <f:link.action
        action="list"
        class="bg-secondary-subtle btn me-2 p-2">
        <core:icon
            identifier="psb-templates-arrow-left"
            size="small" />
        <psbFoundation:translate id="backToList" />
    </f:link.action>

    <f:link.action
        action="edit"
        arguments="{contactGroup: contactGroup}"
        class="bg-primary-subtle btn">
        <core:icon
            identifier="psb-templates-pencil"
            size="small" />
        <psbFoundation:translate id="edit" />
    </f:link.action>

    <f:render
        arguments="{
            classes: 'bg-danger btn ms-auto',
            modalId: 'delete-contactGroup-{contactGroup.uid}-modal',
            text: '{psbTemplates:svgIcon(identifier: \'psb-templates-trash\')}',
            title: '{psbFoundation:translate(id: \'delete\')}'
        }"
        partial="Component/Modal/Toggle" />
</div>

<f:render
    arguments="{
        body: '{psbFoundation:translate(arguments: {name: contactGroup.name}, id: \'modal:body\')}',
        footer: '{f:render(arguments: {contactGroup: contactGroup}, section: \'modalFooter\')}',
        id: 'delete-contactGroup-{contactGroup.uid}-modal',
        title: '{psbFoundation:translate(id: \'modal:title\')}'
    }"
    partial="Component/Modal/Dialog" />

<f:render
    arguments="{contactGroup: contactGroup}"
    partial="ExportModal/Dialog" />

<f:section name="modalFooter">
    <psbFoundation:translation.registerLanguageFile
        file="EXT:psb_contacts/Resources/Private/Language/Frontend/confirmDeleteModal.xlf"
        name="modal" />

    <button
        class="bg-secondary-subtle btn"
        data-bs-dismiss="modal"
        type="button">
        <psbFoundation:translate id="modal:cancel" />
    </button>
    <f:link.action
        action="delete"
        arguments="{contactGroup: contactGroup}"
        class="btn btn-danger">
        <psbFoundation:translate id="modal:delete" />
    </f:link.action>
</f:section>
</html>
