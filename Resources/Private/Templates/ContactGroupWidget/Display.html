<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_contacts/Resources/Private/Language/Frontend/ContactGroup/show.xlf" />

<div class="h-100 position-relative">
    <div class="d-flex flex-column h-100 pb-5">
        <h1>
            {contactGroup.name}
        </h1>
        <f:render
            arguments="{contacts: contactGroup.contactsSorted, pluginUid: pluginUid}"
            partial="ContactList" />
    </div>

    <div class="bg-white bottom-0 d-flex end-0 position-absolute pt-3 start-0 z-1">
        <f:link.action
            action="list"
            class="bg-secondary-subtle btn flex-grow-1 me-2"
            controller="Contact"
            pluginName="ContactList">
            <psbFoundation:translate id="showAllContacts" />
        </f:link.action>

        <f:link.action
            action="edit"
            arguments="{contactGroup: contactGroup}"
            class="bg-primary-subtle btn"
            controller="ContactGroup"
            pluginName="ContactGroups">
            <core:icon
                identifier="psb-templates-pencil"
                size="small" />
            <psbFoundation:translate id="show:edit" />
        </f:link.action>
    </div>
</div>
</html>
